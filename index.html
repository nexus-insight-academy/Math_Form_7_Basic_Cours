<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Математика 7 · Mate 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a school exercise book — graph-paper page, ink-blue text, red margin rule; sidebar of topics + one open topic */
:root {
  --paper: #fbfcf8;
  --grid: #e3ebf3;
  --ink: #1f3a68;
  --text: #22303f;
  --muted: #6a7788;
  --margin: #d1495b;
  --card: #ffffff;
  --line: #d6dee8;
  --soft: #eef3f9;
  --accent: #2f6fdb;
  --ok: #1e8a4c;
  --ok-bg: #e3f5ea;
  --bad: #c8363f;
  --bad-bg: #fbe6e7;
  --warn: #b7791f;
  --warn-bg: #fdf1dc;
  --l1: #1e8a4c;
  --l2: #d9822b;
  --l3: #c8363f;
  --font-display: "Rubik", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "PT Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #18212b; --grid: #1f2a36; --ink: #9cc0ff; --text: #e3e9f0; --muted: #93a1b2; --margin: #ef6f7f;
    --card: #1f2a36; --line: #2f3d4d; --soft: #243242; --accent: #7fb0ff; --ok: #5fd08f; --ok-bg: #173327;
    --bad: #ff7b83; --bad-bg: #3a1d22; --warn: #f0b35a; --warn-bg: #3a2c16; --l1: #5fd08f; --l2: #f0a45a; --l3: #ff7b83;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #18212b; --grid: #1f2a36; --ink: #9cc0ff; --text: #e3e9f0; --muted: #93a1b2; --margin: #ef6f7f;
  --card: #1f2a36; --line: #2f3d4d; --soft: #243242; --accent: #7fb0ff; --ok: #5fd08f; --ok-bg: #173327;
  --bad: #ff7b83; --bad-bg: #3a1d22; --warn: #f0b35a; --warn-bg: #3a2c16; --l1: #5fd08f; --l2: #f0a45a; --l3: #ff7b83;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--text);
  font: 16px/1.5 var(--font-body);
  margin: 0;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); color: var(--ink); text-wrap: balance; margin: 0; line-height: 1.2; }

.app { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; background: var(--paper); border-bottom: 2px solid var(--margin);
}
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand .logo { display: block; height: 44px; width: auto; background: #fff; border-radius: 8px; padding: 4px 8px; }
.brand .titles { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
@media (max-width: 480px) { .brand .logo { height: 36px; } .brand span { display: none; } }
.brand b { font: 700 1.5rem var(--font-display); color: var(--ink); letter-spacing: 0.01em; }
.brand span { color: var(--muted); font-size: 0.95rem; }
.lang { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 6px 14px; font: 700 0.9rem var(--font-display); letter-spacing: 0.06em; color: var(--ink); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.prof button { letter-spacing: 0; text-transform: none; }
.top .lang + .prof { margin-left: auto; }
.home .prof-note { color: var(--muted); }

.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 24px; margin-top: 18px; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { display: none; } .mobile-pick { display: block !important; } }

.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); align-self: start; max-height: calc(100vh - 90px); overflow: auto; padding-right: 4px; }
.sem { font: 700 0.75rem var(--font-display); text-transform: uppercase; letter-spacing: 0.1em; color: var(--margin); margin: 14px 0 6px; }
.topic-btn {
  display: grid; grid-template-columns: 2.1em minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%;
  text-align: left; background: none; border: 0; border-radius: 8px; padding: 7px 8px; color: var(--text); line-height: 1.25;
}
.topic-btn:hover { background: var(--soft); }
.topic-btn[aria-current="true"] { background: var(--card); box-shadow: inset 3px 0 0 var(--margin); font-weight: 700; }
.topic-btn .n { font: 700 0.85rem var(--font-mono); color: var(--muted); }
.chip { font: 600 0.72rem var(--font-mono); padding: 2px 6px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.good { background: var(--ok-bg); color: var(--ok); }
.chip.mid { background: var(--warn-bg); color: var(--warn); }
.chip.low { background: var(--bad-bg); color: var(--bad); }

.mobile-pick { display: none; margin-top: 14px; }
.mobile-pick select { width: 100%; padding: 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); font-size: 1rem; }

.main { min-width: 0; }
.topic-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.topic-head .num { font: 700 1rem var(--font-mono); color: var(--margin); }
.topic-head h1 { font-size: clamp(1.4rem, 3vw, 2rem); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
.tab {
  border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px;
  font: 600 0.92rem var(--font-display); color: var(--text); display: inline-flex; align-items: center; gap: 8px;
}
.tab[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.tab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); }

.sheet { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px 18px 34px; position: relative; }
.sheet::before { content: ""; position: absolute; left: 20px; top: 0; bottom: 0; width: 2px; background: var(--margin); opacity: 0.7; }
.sheet ul { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; }
.sheet li::marker { color: var(--margin); }
.example { margin-top: 16px; padding: 12px 14px; border-radius: 8px; background: var(--soft); border-left: 3px solid var(--accent); }
.example b { color: var(--ink); }
.go { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }

.intro { color: var(--muted); margin: 0 0 12px; max-width: 70ch; }
.qs { display: grid; gap: 12px; }
.q { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; }
.q.ok { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
.q.bad { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
.q-top { display: flex; gap: 10px; align-items: flex-start; }
.q-n { font: 700 0.95rem var(--font-mono); color: var(--paper); background: var(--c); border-radius: 6px; min-width: 1.9em; text-align: center; padding: 1px 4px; }
.q-text { flex: 1; min-width: 0; }
.q-pts { font: 600 0.8rem var(--font-mono); color: var(--muted); white-space: nowrap; }
.q-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.q-row input {
  font: 500 1rem var(--font-mono); padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line);
  background: var(--paper); width: min(260px, 100%);
}
.q-row input:focus { border-color: var(--accent); }
.unit { color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1.5px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 12px; text-align: left; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); font-weight: 700; }
.hint-btn { border: 1px dashed var(--warn); background: none; color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: 0.9rem; }
.hint { background: var(--warn-bg); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; }
.feedback { border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; }
.feedback.ok { background: var(--ok-bg); }
.feedback.bad { background: var(--bad-bg); }
.feedback b { font-family: var(--font-display); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.btn { border: 0; border-radius: 10px; padding: 11px 18px; font: 700 1rem var(--font-display); background: var(--ink); color: var(--paper); }
.btn.ghost { background: none; color: var(--ink); border: 1.5px solid var(--ink); }

.score { margin-top: 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center;
  background: var(--card); border: 2px solid var(--ink); border-radius: var(--radius); padding: 16px 18px; }
.grade { font: 700 3rem/1 var(--font-display); color: var(--ink); text-align: center; min-width: 2.2em; font-variant-numeric: tabular-nums; }
.grade small { display: block; font: 600 0.75rem var(--font-body); color: var(--muted); letter-spacing: 0.05em; }
.score h3 { font-size: 1.15rem; }
.bar { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--c, var(--ok)); }

.report { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px 14px; }
.report label { font: 600 0.9rem var(--font-display); color: var(--ink); }
.report input { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper); width: min(240px, 100%); }
.vchip { background: var(--soft); color: var(--ink); font-weight: 700; }
.home h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); }
.home p { max-width: 68ch; }
.how { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
@media (min-width: 1000px) { .how { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 480px) { .how { grid-template-columns: minmax(0, 1fr); } }
.how div { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.how b { display: block; font-family: var(--font-display); color: var(--ink); margin-bottom: 4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tcard { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; }
.tcard:hover { border-color: var(--ink); }
.tcard .n { font: 700 0.8rem var(--font-mono); color: var(--margin); }
.tcard .levels { display: flex; gap: 6px; flex-wrap: wrap; }

.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.85em; line-height: 1.05; margin: 0 1px; }
.fr > span:first-child { border-bottom: 1.3px solid currentColor; padding: 0 2px; }
.fr > span:last-child { padding: 0 2px; }
sup { line-height: 0; }
.vec { position: relative; display: inline-block; padding-top: 0.32em; line-height: 1; }
.vec::before { content: ""; position: absolute; left: 0.05em; right: 0.3em; top: 0.12em; border-top: 1.4px solid currentColor; }
.vec::after { content: ""; position: absolute; right: 0; top: calc(0.12em - 0.21em + 0.7px); border: 0.21em solid transparent; border-left: 0.34em solid currentColor; border-right-width: 0; }
@media (prefers-reduced-motion: no-preference) { .q, .tab, .btn { transition: border-color .15s, background-color .15s, box-shadow .15s; } }
</style>
</head>

15} = {4/15} din hartă. 32 : {4/15} = 32 · {15/4} = 120. Răspuns: 120."}, "variants": [{"q": {"ru": "В кинозале {1/4} мест заняли семиклассники, {3/8} — восьмиклассники, а 15 мест свободны. Сколько всего мест в зале?", "ro": "Într-o sală de cinema {1/4} din locuri le-au ocupat elevii din clasa a VII-a, {3/8} — cei din clasa a VIII-a, iar 15 locuri sunt libere. Câte locuri are sala?"}, "type": "num", "answer": "40", "explain": {"ru": "Свободно 1 − {2/8} − {3/8} = {3/8} мест. 15 : {3/8} = 15 · {8/3} = 40. Ответ: 40.", "ro": "Libere sunt 1 − {2/8} − {3/8} = {3/8} din locuri. 15 : {3/8} = 15 · {8/3} = 40. Răspuns: 40."}, "hint": {"ru": "Найдите, какая часть осталась (1 минус обе части), — она равна известному числу. Затем число по его дроби: делим.", "ro": "Aflați ce parte a rămas (1 minus ambele părți) — ea este egală cu numărul cunoscut. Apoi numărul după fracția lui: împărțim."}}, {"q": {"ru": "Из скачиваемого обновления {3/10} загрузилось утром, {1/6} — днём, а осталось 48 МБ. Каков размер обновления?", "ro": "Dintr-o actualizare {3/10} s-a descărcat dimineața, {1/6} — la amiază, iar au rămas 48 MB. Ce mărime are actualizarea?"}, "type": "num", "answer": "90", "unit": {"ru": "МБ", "ro": "MB"}, "explain": {"ru": "Осталось 1 − {9/30} − {5/30} = {16/30} = {8/15}. 48 : {8/15} = 48 · {15/8} = 90. Ответ: 90 МБ.", "ro": "A rămas 1 − {9/30} − {5/30} = {16/30} = {8/15}. 48 : {8/15} = 48 · {15/8} = 90. Răspuns: 90 MB."}, "hint": {"ru": "Найдите, какая часть осталась (1 минус обе части), — она равна известному числу. Затем число по его дроби: делим.", "ro": "Aflați ce parte a rămas (1 minus ambele părți) — ea este egală cu numărul cunoscut. Apoi numărul după fracția lui: împărțim."}}]}]]}, {"id": "03", "num": 3, "semester": 1, "title": {"ru": "Делимость. НОД и НОК", "ro": "Divizibilitatea. c.m.m.d.c. și c.m.m.m.c."}, "cheat": {"ru": ["Делитель числа a — число, на которое a делится без остатка; кратное a — число, которое делится на a.", "На 2 — последняя цифра чётная; на 5 — 0 или 5; на 10 — 0; на 3 (на 9) — сумма цифр делится на 3 (на 9).", "Простое число имеет ровно два делителя: 2, 3, 5, 7, 11, 13, … Число 1 — ни простое, ни составное.", "Разложение на простые множители: делим по очереди на 2, 3, 5, 7…: 360 = 2<sup>3<\/sup> · 3<sup>2<\/sup> · 5.", "НОД — общие простые множители в меньшей степени; НОК — все простые множители в большей степени.", "НОД(a; b) · НОК(a; b) = a · b. Взаимно простые: НОД = 1, тогда НОК = a · b.", "«Разложить поровну без остатка, наибольшее число наборов» — НОД; «снова одновременно, наименьшее общее» — НОК."], "ro": ["Divizorul numărului a este un număr la care a se împarte fără rest; multiplul lui a este un număr care se divide cu a.", "Cu 2 — ultima cifră pară; cu 5 — 0 sau 5; cu 10 — 0; cu 3 (cu 9) — suma cifrelor se divide cu 3 (cu 9).", "Numărul prim are exact doi divizori: 2, 3, 5, 7, 11, 13, … Numărul 1 nu este nici prim, nici compus.", "Descompunerea în factori primi: împărțim pe rând la 2, 3, 5, 7…: 360 = 2<sup>3<\/sup> · 3<sup>2<\/sup> · 5.", "c.m.m.d.c. — factorii primi comuni la puterea cea mai mică; c.m.m.m.c. — toți factorii primi la puterea cea mai mare.", "c.m.m.d.c.(a; b) · c.m.m.m.c.(a; b) = a · b. Numere prime între ele: c.m.m.d.c. = 1, atunci c.m.m.m.c. = a · b.", "„Împărțim în mod egal fără rest, cel mai mare număr de pachete” — c.m.m.d.c.; „din nou deodată, cel mai mic comun” — c.m.m.m.c."]}, "example": {"ru": "Пример: 24 = 2<sup>3<\/sup> · 3, 36 = 2<sup>2<\/sup> · 3<sup>2<\/sup>. НОД(24; 36) = 2<sup>2<\/sup> · 3 = 12, НОК(24; 36) = 2<sup>3<\/sup> · 3<sup>2<\/sup> = 72; 12 · 72 = 24 · 36.", "ro": "Exemplu: 24 = 2<sup>3<\/sup> · 3, 36 = 2<sup>2<\/sup> · 3<sup>2<\/sup>. c.m.m.d.c.(24; 36) = 2<sup>2<\/sup> · 3 = 12, c.m.m.m.c.(24; 36) = 2<sup>3<\/sup> · 3<sup>2<\/sup> = 72; 12 · 72 = 24 · 36."}, "levels": [[{"q": {"ru": "Найдите НОД(48; 60).", "ro": "Aflați c.m.m.d.c.(48; 60)."}, "type": "num", "answer": "12", "hint": {"ru": "Разложите оба числа на простые множители и возьмите общие множители 5", "3 514", "6 703", "2 742"]}, "explain": {"ru": "Нужно делиться на 2 и на 3. 4 125 и 6 703 нечётные; у 3 514 сумма цифр 13; у 2 742 — чётное и сумма 15. Ответ: 2 742.", "ro": "Trebuie să se dividă cu 2 și cu 3. 4 125 și 6 703 sunt impare; la 3 514 suma cifrelor 13; 2 742 este par și are suma 15. Răspuns: 2 742."}, "hint": {"ru": "Признак делимости: на 9 — сумма цифр делится на 9; на 6 — на 2 и на 3 одновременно; на 45 — на 5 и на 9.", "ro": "Criteriul: cu 9 — suma cifrelor se divide cu 9; cu 6 — cu 2 și cu 3 în același timp; cu 45 — cu 5 și cu 9."}}, {"q": {"ru": "Какое из чисел делится на 45?", "ro": "Care dintre numere se divide cu 45?"}, "type": "choice", "answer": 0, "options": {"ru": ["7 425", "3 456", "2 215", "6 330"], "ro": ["7 425", "3 456", "2 215", "6 330"]}, "explain": {"ru": "45 = 5 · 9: нужна последняя цифра 0 или 5 и сумма цифр, кратная 9. Подходит 7 425 (сумма 18); 3 456 не делится на 5, у 2 215 и 6 330 суммы 10 и 12. Ответ: 7 425.", "ro": "45 = 5 · 9: ultima cifră 0 sau 5 și suma cifrelor multiplu de 9. Se potrivește 7 425 (suma 18); 3 456 nu se divide cu 5, 2 215 și 6 330 au sumele 10 și 12. Răspuns: 7 425."}, "hint": {"ru": "Признак делимости: на 9 — сумма цифр делится на 9; на 6 — на 2 и на 3 одновременно; на 45 — на 5 и на 9.", "ro": "Criteriul: cu 9 — suma cifrelor se divide cu 9; cu 6 — cu 2 și cu 3 în același timp; cu 45 — cu 5 și cu 9."}}]}, {"q": {"ru": "Сколько делителей у числа 36?", "ro": "Câți divizori are numărul 36?"}, "type": "num", "answer": "9", "hint": {"ru": "Ищите делители парами: a = 1 · a = 2 · … Пару из двух одинаковых чисел считай один раз.", "ro": "Căutați divizorii în perechi: a = 1 · a = 2 · … Perechea din două numere egale se numără o singură dată."}, "explain": {"ru": "Делители 36: 1, 2, 3, 4, 6, 9, 12, 18, 36. Ответ: 9.", "ro": "Divizorii lui 36: 1, 2, 3, 4, 6, 9, 12, 18, 36. Răspuns: 9."}, "variants": [{"q": {"ru": "Сколько делителей у числа 60?", "ro": "Câți divizori are numărul 60?"}, "type": "num", "answer": "12", "explain": {"ru": "Делители 60: 1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60. Ответ: 12.", "ro": "Divizorii lui 60: 1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60. Răspuns: 12."}, "hint": {"ru": "Ищите делители парами: a = 1 · a = 2 · … Пару из двух одинаковых чисел считай один раз.", "ro": "Căutați divizorii în perechi: a = 1 · a = 2 · … Perechea din două numere egale se numără o singură dată."}}, {"q": {"ru": "Сколько делителей у числа 50?", "ro": "Câți divizori are numărul 50?"}, "type": "num", "answer": "6", "explain": {"ru": "Делители 50: 1, 2, 5, 10, 25, 50. Ответ: 6.", "ro": "Divizorii lui 50: 1, 2, 5, 10, 25, 50. Răspuns: 6."}, "hint": {"ru": "Ищите делители парами: a = 1 · a = 2 · … Пару из двух одинаковых чисел считай один раз.", "ro": "Căutați divizorii în perechi: a = 1 · a = 2 · … Perechea din două numere egale se numără o singură dată."}}]}], [{"q": {"ru": "Разложите число 252 на простые множители. Введите все множители через «;» (с повторениями).", "ro": "Descompuneți numărul 252 în factori primi. Introduceți toți factorii separați prin „;” (cu repetări)."}, "type": "set", "answer": ["2", "2", "3", "3", "7"], "hint": {"ru": "Делите по очереди на 2, 3, 5, 7, 11…, пока не получится 1. Каждый множитель пиши столько раз, сколько раз делил на него.", "ro": "Împărțiți pe rând la 2, 3, 5, 7, 11… până obțineți 1. Scrieți fiecare factor de atâtea ori de câte ori ați împărțit la el."}, "explain": {"ru": "252 : 2 = 126, : 2 = 63, : 3 = 21, : 3 = 7, : 7 = 1. 252 = 2<sup>2<\/sup> · 3<sup>2<\/sup> · 7. Ответ: 2; 2; 3; 3; 7.", "ro": "252 : 2 = 126, : 2 = 63, : 3 = 21, : 3 = 7, : 7 = 1. 252 = 2<sup>2<\/sup> · 3<sup>2<\/sup> · 7. Răspuns: 2; 2; 3; 3; 7."}, "variants": [{"q": {"ru": "Разложите число 330 на простые множители. Введите все множители через «;» (с повторениями).", "ro": "Descompuneți numărul 330 în factori primi. Introduceți toți factorii separați prin „;” (cu repetări)."}, "type": "set", "answer": ["2", "3", "5", "11"], "explain": {"ru": "330 : 2 = 165, : 3 = 55, : 5 = 11, : 11 = 1. 330 = 2 · 3 · 5 · 11. Ответ: 2; 3; 5; 11.", "ro": "330 : 2 = 165, : 3 = 55, : 5 = 11, : 11 = 1. 330 = 2 · 3 · 5 · 11. Răspuns: 2; 3; 5; 11."}, "hint": {"ru": "Делите по очереди на 2, 3, 5, 7, 11…, пока не получится 1. Каждый множитель пиши столько раз, сколько раз делил на него.", "ro": "Împărțiți pe rând la 2, 3, 5, 7, 11… până obțineți 1. Scrieți fiecare factor de atâtea ori de câte ori ați împărțit la el."}}, {"q": {"ru": "Разложите число 392 на простые множители. Введите все множители через «;» (с повторениями).", "ro": "Descompuneți numărul 392 în factori primi. Introduceți toți factorii separați prin „;” (cu repetări)."}, "type": "set", "answer": ["2", "2", "2", "7", "7"], "explain": {"ru": "392 : 2 = 196, : 2 = 98, : 2 = 49, : 7 = 7, : 7 = 1. 392 = 2<sup>3<\/sup> · 7<sup>2<\/sup>. Ответ: 2; 2; 2; 7; 7.", "ro": "392 : 2 = 196, : 2 = 98, : 2 = 49, : 7 = 7, : 7 = 1. 392 = 2<sup>3<\/sup> · 7<sup>2<\/sup>. Răspuns: 2; 2; 2; 7; 7."}, "hint": {"ru": "Делите по очереди на 2, 3, 5, 7, 11…, пока не получится 1. Каждый множитель пиши столько раз, сколько раз делил на него.", "ro": "Împărțiți pe rând la 2, 3, 5, 7, 11… până obțineți 1. Scrieți fiecare factor de atâtea ori de câte ori ați împărțit la el."}}]}, {"q": {"ru": "У стримера 48 стикеров и 72 значка. Он хочет собрать одинаковые призовые наборы и раздать всё без остатка. Какое наибольшее число наборов получится?", "ro": "Un streamer are 48 de stickere și 72 de insigne. Vrea să facă pachete-premiu identice și să împartă totul fără rest. Care este cel mai mare număr de pachete?"}, "type": "num", "answer": "24", "hint": {"ru": "Наборы одинаковые и без остатка — число наборов делит оба количества. Наибольшее такое число — НОД.", "ro": "Pachetele sunt identice și fără rest — numărul de pachete divide ambele cantități. Cel mai mare astfel de număr este c.m.m.d.c."}, "explain": {"ru": "НОД(48; 72) = 24: в каждом наборе 2 стикера и 3 значка. Ответ: 24.", "ro": "c.m.m.d.c.(48; 72) = 24: în fiecare pachet 2 stickere și 3 insigne. Răspuns: 24."}, "variants": [{"q": {"ru": "На день рождения купили 45 пончиков и 75 маффинов. Их разложили на одинаковые тарелки без остатка. Какое наибольшее число тарелок можно накрыть?", "ro": "Pentru o zi de naștere s-au cumpărat 45 de gogoși și 75 de brioșe. Ele au fost puse pe farfurii identice fără rest. Care este cel mai mare număr de farfurii?"}, "type": "num", "answer": "15", "explain": {"ru": "НОД(45; 75) = 15: на каждой тарелке 3 пончика и 5 маффинов. Ответ: 15.", "ro": "c.m.m.d.c.(45; 75) = 15: pe fiecare farfurie 3 gogoși și 5 brioșe. Răspuns: 15."}, "hint": {"ru": "Наборы одинаковые и без остатка — число наборов делит оба количества. Наибольшее такое число — НОД.", "ro": "Pachetele sunt identice și fără rest — numărul de pachete divide ambele cantități. Cel mai mare astfel de număr este c.m.m.d.c."}}, {"q": {"ru": "В клубе 56 мальчиков и 84 девочки. Их делят на одинаковые команды так, чтобы в каждой было поровну мальчиков и поровну девочек. Какое наибольшее число команд?", "ro": "Într-un club sunt 56 de băieți și 84 de fete. Ei se împart în echipe identice, astfel încât în fiecare să fie același număr de băieți și de fete. Care este cel mai mare număr de echipe?"}, "type": "num", "answer": "28", "explain": {"ru": "НОД(56; 84) = 28: в каждой команде 2 мальчика и 3 девочки. Ответ: 28.", "ro": "c.m.m.d.c.(56; 84) = 28: în fiecare echipă 2 băieți și 3 fete. Răspuns: 28."}, "hint": {"ru": "Наборы одинаковые и без остатка — число наборов делит оба количества. Наибольшее такое число — НОД.", "ro": "Pachetele sunt identice și fără rest — numărul de pachete divide ambele cantități. Cel mai mare astfel de număr este c.m.m.d.c."}}]}, {"q": {"ru": "В игре один босс появляется каждые 12 минут, а другой — каждые 20 минут. Сейчас они появились одновременно. Через сколько минут они снова появятся вместе?", "ro": "Într-un joc un boss apare la fiecare 12 minute, iar altul — la fiecare 20 de minute. Acum au apărut deodată. Peste câte minute v 8", "10"], "hint": {"ru": "Нарисуйте два круга: «только A», «только B» и общая часть. Общая часть — всё остальное из A ∪ B.", "ro": "Desenați două cercuri: „doar A”, „doar B” și partea comună. Partea comună este tot restul din A ∪ B."}, "explain": {"ru": "A ∩ B = {5; 6; 7; 8}. B = (B \\ A) ∪ (A ∩ B) = {2; 3; 5; 6; 7; 8; 10}. Ответ: 2; 3; 5; 6; 7; 8; 10.", "ro": "A ∩ B = {5; 6; 7; 8}. B = (B \\ A) ∪ (A ∩ B) = {2; 3; 5; 6; 7; 8; 10}. Răspuns: 2; 3; 5; 6; 7; 8; 10."}}, {"q": {"ru": "A ∪ B = {0; 1; …; 7}, A \\ B = {0; 5}, B \\ A = {1; 2; 6}. Найдите множество A.", "ro": "A ∪ B = {0; 1; …; 7}, A \\ B = {0; 5}, B \\ A = {1; 2; 6}. Aflați mulțimea A."}, "type": "set", "answer": ["0", "3", "4", "5", "7"], "hint": {"ru": "Нарисуйте два круга: «только A», «только B» и общая часть. Общая часть — всё остальное из A ∪ B.", "ro": "Desenați două cercuri: „doar A”, „doar B” și partea comună. Partea comună este tot restul din A ∪ B."}, "explain": {"ru": "A ∩ B = {3; 4; 7}. A = (A \\ B) ∪ (A ∩ B) = {0; 3; 4; 5; 7}. Ответ: 0; 3; 4; 5; 7.", "ro": "A ∩ B = {3; 4; 7}. A = (A \\ B) ∪ (A ∩ B) = {0; 3; 4; 5; 7}. Răspuns: 0; 3; 4; 5; 7."}}]}, {"q": {"ru": "A — множество чисел от 1 до 50, кратных 4; B — множество чисел от 1 до 50, кратных 6. Найдите card (A ∪ B).", "ro": "A este mulțimea numerelor de la 1 la 50 multiple de 4; B — mulțimea numerelor de la 1 la 50 multiple de 6. Aflați card (A ∪ B)."}, "type": "num", "answer": "16", "hint": {"ru": "Кратные и 4, и 6 — это кратные НОК(4; 6) = 12. Затем формула card (A ∪ B).", "ro": "Multiplii și ai lui 4, și ai lui 6 sunt multiplii c.m.m.m.c.(4; 6) = 12. Apoi formula card (A ∪ B)."}, "explain": {"ru": "card A = 12 (4; 8; …; 48), card B = 8 (6; 12; …; 48). A ∩ B — кратные 12: 12; 24; 36; 48, card = 4. card (A ∪ B) = 12 + 8 − 4 = 16. Ответ: 16.", "ro": "card A = 12 (4; 8; …; 48), card B = 8 (6; 12; …; 48). A ∩ B — multiplii lui 12: 12; 24; 36; 48, card = 4. card (A ∪ B) = 12 + 8 − 4 = 16. Răspuns: 16."}, "variants": [{"q": {"ru": "A — множество чисел от 1 до 60, кратных 6; B — множество чисел от 1 до 60, кратных 9. Найдите card (A ∪ B).", "ro": "A este mulțimea numerelor de la 1 la 60 multiple de 6; B — mulțimea numerelor de la 1 la 60 multiple de 9. Aflați card (A ∪ B)."}, "type": "num", "answer": "13", "hint": {"ru": "Кратные и 6, и 9 — это кратные НОК(6; 9). Затем формула card (A ∪ B).", "ro": "Multiplii și ai lui 6, și ai lui 9 sunt multiplii c.m.m.m.c.(6; 9). Apoi formula card (A ∪ B)."}, "explain": {"ru": "card A = 10, card B = 6 (9; …; 54). A ∩ B — кратные НОК(6; 9) = 18: 18; 36; 54, card = 3. card (A ∪ B) = 10 + 6 − 3 = 13. Ответ: 13.", "ro": "card A = 10, card B = 6 (9; …; 54). A ∩ B — multiplii c.m.m.m.c.(6; 9) = 18: 18; 36; 54, card = 3. card (A ∪ B) = 10 + 6 − 3 = 13. Răspuns: 13."}}, {"q": {"ru": "A — множество чисел от 1 до 40, кратных 3; B — множество чисел от 1 до 40, кратных 5. Найдите card (A ∪ B).", "ro": "A este mulțimea numerelor de la 1 la 40 multiple de 3; B — mulțimea numerelor de la 1 la 40 multiple de 5. Aflați card (A ∪ B)."}, "type": "num", "answer": "19", "hint": {"ru": "Кратные и 3, и 5 — это кратные НОК(3; 5). Затем формула card (A ∪ B).", "ro": "Multiplii și ai lui 3, și ai lui 5 sunt multiplii c.m.m.m.c.(3; 5). Apoi formula card (A ∪ B)."}, "explain": {"ru": "card A = 13 (3; …; 39), card B = 8 (5; …; 40). A ∩ B — кратные 15: 15; 30, card = 2. card (A ∪ B) = 13 + 8 − 2 = 19. Ответ: 19.", "ro": "card A = 13 (3; …; 39), card B = 8 (5; …; 40). A ∩ B — multiplii lui 15: 15; 30, card = 2. card (A ∪ B) = 13 + 8 − 2 = 19. Răspuns: 19."}}]}]]}, {"id": "09", "num": 9, "semester": 1, "title": {"ru": "Алгебраические выражения", "ro": "Expresii algebrice"}, "cheat": {"ru": ["Числовое выражение — только числа и знаки действий; алгебраическое — есть буквы (переменные): 5x, 2a + 3b.", "Коэффициент — числовой множитель, буквенная часть — произведение букв: у −{3/4}a<sup>2<\/sup>b коэффициент −{3/4}; у x он 1, у −x равен −1; {ax/2} = {1/2}ax.", "Член выражения пишем со своим знаком: в 5 − 3x чл ", "ro": "Pentru ce x expresia {2x/4 − x} nu are sens?"}, "type": "num", "answer": "4", "hint": {"ru": "Выражение не имеет смысла, когда знаменатель равен 0. Приравняйте знаменатель к нулю.", "ro": "Expresia nu are sens când numitorul este egal cu 0. Egalați numitorul cu zero."}, "explain": {"ru": "4 − x = 0, x = 4. Ответ: 4.", "ro": "4 − x = 0, x = 4. Răspuns: 4."}}]}], [{"q": {"ru": "Упростите (x + 5)(x − 1) − (x − 2)(x + 3) и найдите значение при x = −3.", "ro": "Simplificați (x + 5)(x − 1) − (x − 2)(x + 3) și aflați valoarea pentru x = −3."}, "type": "num", "answer": "-8", "hint": {"ru": "Сумму на сумму: каждое слагаемое на каждое (4 произведения). Второе произведение вычитайте целиком, в скобках.", "ro": "Suma cu suma: fiecare termen cu fiecare (4 produse). Al doilea produs se scade în întregime, în paranteze."}, "explain": {"ru": "(x + 5)(x − 1) = x<sup>2<\/sup> + 4x − 5;  (x − 2)(x + 3) = x<sup>2<\/sup> + x − 6.  Разность: x<sup>2<\/sup> + 4x − 5 − x<sup>2<\/sup> − x + 6 = 3x + 1. При x = −3: −9 + 1 = −8. Ответ: −8.", "ro": "(x + 5)(x − 1) = x<sup>2<\/sup> + 4x − 5;  (x − 2)(x + 3) = x<sup>2<\/sup> + x − 6.  Diferența: x<sup>2<\/sup> + 4x − 5 − x<sup>2<\/sup> − x + 6 = 3x + 1. Pentru x = −3: −9 + 1 = −8. Răspuns: −8."}, "variants": [{"q": {"ru": "Найдите значение выражения (a + 3)(a + 4) − a(a + 7) при a = 2026.", "ro": "Aflați valoarea expresiei (a + 3)(a + 4) − a(a + 7) pentru a = 2026."}, "type": "num", "answer": "12", "hint": {"ru": "Сумму на сумму: каждое слагаемое на каждое (4 произведения). Второе произведение вычитайте целиком, в скобках.", "ro": "Suma cu suma: fiecare termen cu fiecare (4 produse). Al doilea produs se scade în întregime, în paranteze."}, "explain": {"ru": "(a + 3)(a + 4) = a<sup>2<\/sup> + 7a + 12;  a(a + 7) = a<sup>2<\/sup> + 7a.  Разность равна 12 при любом a, в том числе при a = 2026. Ответ: 12.", "ro": "(a + 3)(a + 4) = a<sup>2<\/sup> + 7a + 12;  a(a + 7) = a<sup>2<\/sup> + 7a.  Diferența este 12 pentru orice a, inclusiv pentru a = 2026. Răspuns: 12."}}, {"q": {"ru": "Найдите значение выражения (y − 2)(y + 6) − (y + 1)(y + 3) при y = 37.", "ro": "Aflați valoarea expresiei (y − 2)(y + 6) − (y + 1)(y + 3) pentru y = 37."}, "type": "num", "answer": "-15", "hint": {"ru": "Сумму на сумму: каждое слагаемое на каждое (4 произведения). Второе произведение вычитайте целиком, в скобках.", "ro": "Suma cu suma: fiecare termen cu fiecare (4 produse). Al doilea produs se scade în întregime, în paranteze."}, "explain": {"ru": "(y − 2)(y + 6) = y<sup>2<\/sup> + 4y − 12;  (y + 1)(y + 3) = y<sup>2<\/sup> + 4y + 3.  Разность: −12 − 3 = −15 при любом y. Ответ: −15.", "ro": "(y − 2)(y + 6) = y<sup>2<\/sup> + 4y − 12;  (y + 1)(y + 3) = y<sup>2<\/sup> + 4y + 3.  Diferența: −12 − 3 = −15 pentru orice y. Răspuns: −15."}}]}, {"q": {"ru": "Какое равенство верно?", "ro": "Care egalitate este adevărată?"}, "type": "choice", "answer": 1, "options": {"ru": ["−3(x − 4) = −3x − 12", "−3(x − 4) = −3x + 12", "−(5 − x + y) = −5 − x − y", "2(3a − 1) = 6a − 1"], "ro": ["−3(x − 4) = −3x − 12", "−3(x − 4) = −3x + 12", "−(5 − x + y) = −5 − x − y", "2(3a − 1) = 6a − 1"]}, "hint": {"ru": "Множитель перед скобкой умножается на каждое слагаемое; следите за знаками.", "ro": "Factorul din fața parantezei se înmulțește cu fiecare termen; urmăriți semnele."}, "explain": {"ru": "−3(x − 4) = −3x + 12 (минус на минус даёт плюс). −(5 − x + y) = −5 + x − y; 2(3a − 1) = 6a − 2. Ответ: −3(x − 4) = −3x + 12.", "ro": "−3(x − 4) = −3x + 12 (minus cu minus dă plus). −(5 − x + y) = −5 + x − y; 2(3a − 1) = 6a − 2. Răspuns: −3(x − 4) = −3x + 12."}, "variants": [{"q": {"ru": "Выберите верное равенство.", "ro": "Alegeți egalitatea adevărată."}, "type": "choice", "answer": 2, "options": {"ru": ["−(2a − b + 3) = −2a − b − 3", "4(m − 2n) = 4m − 2n", "−(2a − b + 3) = −2a + b − 3", "−2(x + 5) = −2x + 10"], "ro": ["−(2a − b + 3) = −2a − b − 3", "4(m − 2n) = 4m − 2n", "−(2a − b + 3) = −2a + b − 3", "−2(x + 5) = −2x + 10"]}, "hint": {"ru": "Множитель перед скобкой умножается на каждое слагаемое; следите за знаками.", "ro": "Factorul din fața parantezei se înmulțește cu fiecare termen; urmăriți semnele."}, "explain": {"ru": "−(2a − b + 3) = −2a + b − 3 — меняются знаки всех слагаемых. 4(m − 2n) = 4m − 8n; −2(x + 5) = −2x − 10. Ответ: −(2a − b + 3) = −2a + b − 3.", "ro": "−(2a − b + 3) = −2a + b − 3 — se schimbă semnele tuturor termenilor. 4(m − 2n) = 4m − 8n; −2(x + 5) = −2x − 10. Răspuns: −(2a − b + 3) = −2a + b − 3."}}, {"q": {"ru": "Чему равно (x + 2)(x + 3)?", "ro": "Cu ce este egal (x + 2)(x + 3)?"}, "type": "choice", "answer": 3, "options": {"ru": ["x<sup>2<\/sup> + 6", "x<sup>2<\/sup> + 5x + 5", "7x + 6", "x<sup>2<\/sup> + 5x + 6"], "ro": ["x<sup>2<\/sup> + 6", "x<sup>2<\/sup> + 5x + 5", "7x + 6", "x<sup>2<\/sup> + 5x + 6"]}, "hint": {"ru": "Каждое слагаемое первой скобки умножьте на каждое слагаемое второй.", "ro": "Înmulțiți fiecare termen al primei paranteze cu fiecare termen al celei de-a doua."}, "explain": {"ru": "(x + 2)(x + 3) = x<sup>2<\/sup> + 3x + 2x + 6 = x<sup>2<\/sup> + 5x + 6 — четыре произведения, ни одно не теряем. Ответ: x<sup>2<\/sup> + 5x + 6.", "ro": "(x + 2)(x + 3) = x<sup>2<\/sup> + 3x + 2x + 6 = x<sup>2<\/sup> + 5x + 6 — patru produse, nu pierdem niciunul. Răspuns: x<sup>2<\/sup> + 5x + 6."}}]}, {"q": {"ru": "Маша купила 3 пиццы по p леев и 2 сока по s леев, а Дима — 1 пиццу и 5 соков. Запишите, сколько они заплатили вместе, упростите и найдите сумму при p = 110, s = 15.", "ro": "Masha a cumpărat 3 pizze a câte p lei și 2 sucuri a câte s lei, iar Dima — 1 pizza și 5 sucuri. Scrieți cât au plătit împreună, simplificați și aflați suma pentru p = 110, s = 15."}, "type": "num", "answer": "545", "unit": {"ru": "леев", "ro": "lei"}, "hint": {"ru": "Запишите покупки каждого, сложите и приведите подобные (пиццы с пиццами, соки с соками).", "ro": "Scrieți cumpărăturile fiecăruia, adunați și reduceți termenii asemenea (pizzele cu pizzele, sucurile cu sucurile)."}, "explain": {"ru": "3p + 2s + p + 5s = 4p + 7s. При p = 110, s = 15: 440 + 105 = 545. Ответ: 545 леев.", "ro": "3p + 2s + p + 5s = 4p + 7s. Pentru p = 110, s = 15: 440 + 105 = 545. Răspuns: 545 lei."}, "variants": [{"q": {"ru": "Билет в кино стоит x леев, а попкорн — на 20 леев дешевле. Друзья купили 4 билета и 3 попкорна. Запишите стоимость покупки, упростите и найдите её при x = 75.", "ro": "Un bilet la cinema costă x lei, iar popcornul — cu 20 de lei mai ieftin. Prietenii au cumpărat 4 bilete și 3 porții de popcorn. Scrieți costul, simplificați și aflați-l pentru x = 75."}, "type": "num", "answer": "465", "unit": {"ru": "леев", "ro": "lei"}, "hint": {"ru": "Запишите покупки каждого, сложите и приведите подобные (пиццы с пиццами, соки с соками).", "ro": "Scrieți cumpărăturile fiecăruia, adunați și reduceți termenii asemenea (pizzele cu pizzele, sucurile cu sucurile)."}, "explain": {"ru": "4x + 3(x − 20) = 4x + 3x − 60 = 7x − 60. При x = 75: 525 − 60 = 465. Ответ: 465 леев.", "ro": "4x + 3(x − 20) = 4x + 3x − 60 = 7x − 60. Pentru x = 75: 525 − 60 = 465. Răspuns: 465 lei."}}, {"q": {"ru": "Геймер купил 3 скина по s леев и 2 кейса по k леев, а потом продал 1 скин за (s + 10) леев. Сколько леев он потратил в итоге? Упростите и найдите при s = 45, k = 60.", "ro": "Un gamer a cumpărat 3 skinuri a câte s lei și 2 cutii a câte k lei, apoi a vândut 1 skin cu (s + 10) lei. Câți lei a cheltuit în final? Simplificați și aflați pentru s = 45, k = 60."}, "type": "num", "answer": "200", "unit": {"ru": "леев", "ro": "lei"}, "hint": {"ru": "Запишите покупки каждого, сложите и приведите подобные (пиццы с пиццами, соки с соками).", "ro": "Scrieți cumpărăturile fiecăruia, adunați și reduceți termenii asemenea (pizzele cu pizzele, sucurile cu sucurile)."}, "explain": {"ru": "3s + 2k − (s + 10) = 2s + 2k − 10. При s = 45, k = 60: 90 + 120 − 10 = 200. Ответ: 200 леев.", "ro": "3s + 2k − (s + 10) = 2s + 2k − 10. Pentru s = 45, k = 60: 90 + 120 − 10 = 200. Răspuns: 200 lei."}}]}, {"q": {"ru": "Прямоугольный стикер имеет размеры ((a<sub>1<\/sub> − b<sub>1<\/sub>)<sup>2<\/sup> + (a<sub>2<\/sub> − b<sub>2<\/sub>)<sup>2<\/sup>): aflați diferențele absciselor și ale ordonatelor."}, "explain": {"ru": "|−5 − 3| = 8, |7 − (−8)| = 15. AB = √(64 + 225) = √289 = 17. Ответ: 17.", "ro": "|−5 − 3| = 8, |7 − (−8)| = 15. AB = √(64 + 225) = √289 = 17. Răspuns: 17."}}]}, {"q": {"ru": "Точка M(1; −2) — середина отрезка AB, A(−5; 3). Найдите координаты точки B. Введите x; y.", "ro": "Punctul M(1; −2) este mijlocul segmentului AB, A(−5; 3). Aflați coordonatele punctului B. Scrieți x; y."}, "type": "set", "answer": ["7", "-7"], "ordered": true, "hint": {"ru": "Координата середины — среднее арифметическое: умножьте координату M на 2 и вычтите координату A.", "ro": "Coordonata mijlocului este media aritmetică: înmulțiți coordonata lui M cu 2 și scădeți coordonata lui A."}, "explain": {"ru": "{−5 + x/2} = 1 ⇒ −5 + x = 2 ⇒ x = 7;  {3 + y/2} = −2 ⇒ 3 + y = −4 ⇒ y = −7. B(7; −7). Ответ: B(7; −7).", "ro": "{−5 + x/2} = 1 ⇒ −5 + x = 2 ⇒ x = 7;  {3 + y/2} = −2 ⇒ 3 + y = −4 ⇒ y = −7. B(7; −7). Răspuns: B(7; −7)."}, "variants": [{"q": {"ru": "Начало координат O(0; 0) — середина отрезка AB, B(−6; 4). Найдите координаты точки A. Введите x; y.", "ro": "Originea O(0; 0) este mijlocul segmentului AB, B(−6; 4). Aflați coordonatele punctului A. Scrieți x; y."}, "type": "set", "answer": ["6", "-4"], "ordered": true, "hint": {"ru": "Координата середины — среднее арифметическое: умножьте координату M на 2 и вычтите координату A.", "ro": "Coordonata mijlocului este media aritmetică: înmulțiți coordonata lui M cu 2 și scădeți coordonata lui A."}, "explain": {"ru": "{x + (−6)/2} = 0 ⇒ x = 6;  {y + 4/2} = 0 ⇒ y = −4. A и B симметричны относительно O: A(6; −4). Ответ: A(6; −4).", "ro": "{x + (−6)/2} = 0 ⇒ x = 6;  {y + 4/2} = 0 ⇒ y = −4. A și B sunt simetrice față de O: A(6; −4). Răspuns: A(6; −4)."}}, {"q": {"ru": "Точка M(2,5; 0) — середина отрезка AB, A(−1; 4). Найдите координаты точки B. Введите x; y.", "ro": "Punctul M(2,5; 0) este  1| = 12. S = {9 · 12/2} = 54. Răspuns: 54."}}, {"q": {"ru": "Найдите площадь треугольника ABC, если A(−4; −2), B(4; −2), C(4; 13).", "ro": "Aflați aria triunghiului ABC, dacă A(−4; −2), B(4; −2), C(4; 13)."}, "type": "num", "answer": "60", "hint": {"ru": "Одна сторона вертикальная, другая горизонтальная — это катеты прямоугольного треугольника. S = половина произведения катетов.", "ro": "O latură este verticală, alta orizontală — acestea sunt catetele unui triunghi dreptunghic. S = jumătate din produsul catetelor."}, "explain": {"ru": "AB: |4 − (−4)| = 8; BC: |13 − (−2)| = 15. S = {8 · 15/2} = 60. Ответ: 60.", "ro": "AB: |4 − (−4)| = 8; BC: |13 − (−2)| = 15. S = {8 · 15/2} = 60. Răspuns: 60."}}]}, {"q": {"ru": "На карте города одна клетка — 50 м. Дом — в точке (0; 0), стадион — в точке (9; 12). На сколько метров путь вдоль улиц (по линиям сетки) длиннее пути по прямой?", "ro": "Pe harta orașului un pătrățel înseamnă 50 m. Casa este în punctul (0; 0), stadionul — în punctul (9; 12). Cu câți metri este mai lung drumul pe străzi (pe liniile rețelei) decât drumul în linie dreaptă?"}, "type": "num", "answer": "300", "unit": {"ru": "м", "ro": "m"}, "hint": {"ru": "По прямой — формула расстояния; по улицам — сумма горизонтального и вертикального пути. Не забудьте перевести клетки в метры.", "ro": "În linie dreaptă — formula distanței; pe străzi — suma drumului orizontal și vertical. Nu uitați să transformați pătrățelele în metri."}, "explain": {"ru": "По прямой: √(81 + 144) = √225 = 15 клеток = 750 м. По улицам: 9 + 12 = 21 клетка = 1050 м. Разность: 1050 − 750 = 300. Ответ: 300 м.", "ro": "În linie dreaptă: √(81 + 144) = √225 = 15 pătrățele = 750 m. Pe străzi: 9 + 12 = 21 de pătrățele = 1050 m. Diferența: 1050 − 750 = 300. Răspuns: 300 m."}, "variants": [{"q": {"ru": "На карте одна клетка — 100 м. Школа — в точке (0; 0), бассейн — в точке (−5; 12). На сколько метров путь вдоль улиц (по линиям сетки) длиннее пути по прямой?", "ro": "Pe hartă un pătrățel înseamnă 100 m. Școala este în punctul (0; 0), bazinul — în punctul (−5; 12). Cu câți metri este mai lung drumul pe străzi (pe liniile rețelei) decât drumul în linie dreaptă?"}, "type": "num", "answer": "400", "unit": {"ru": "м", "ro": "m"}, "hint": {"ru": "По прямой — формула расстояния; по улицам — сумма горизонтального и вертикального пути. Не забудьте перевести клетки в метры.", "ro": "În linie dreaptă — formula distanței; pe străzi — suma drumului orizontal și vertical. Nu uitați să transformați pătrățelele în metri."}, "explain": {"ru": "По прямой: √(25 + 144) = 13 клеток = 1300 м. По улицам: 5 + 12 = 17 клеток = 1700 м. 1700 − 1300 = 400. Ответ: 400 м.", "ro": "În linie dreaptă: √(25 + 144) = 13 pătrățele = 1300 m. Pe străzi: 5 + 12 = 17 pătrățele = 1700 m. 1700 − 1300 = 400. Răspuns: 400 m."}}, {"q": {"ru": "В игре-стратегии одна клетка карты — 20 м. База — в точке (0; 0), сундук — в точке (12; −16). На сколько метров путь по линиям сетки длиннее пути по прямой?", "ro": "Într-un joc de strategie un pătrățel al hărții înseamnă 20 m. Baza este în punctul (0; 0), cufărul — în punctul (12; −16). Cu câți metri este mai lung drumul pe liniile rețelei decât drumul în linie dreaptă?"}, "type": "num", "answer": "160", "unit": {"ru": "м", "ro": "m"}, "hint": {"ru": "По прямой — формула расстояния; по улицам — сумма горизонтального и вертикального пути. Не забудьте перевести клетки в метры.", "ro": "În linie dreaptă — formula distanței; pe străzi — suma drumului orizontal și vertical. Nu uitați să transformați pătrățelele în metri."}, "explain": {"ru": "По прямой: √(144 + 256) = √400 = 20 клеток = 400 м. По сетке: 12 + 16 = 28 клеток = 560 м. 560 − 400 = 160. Ответ: 160 м.", "ro": "În linie dreaptă: √(144 + 256) = √400 = 20 de pătrățele = 400 m. Pe rețea: 12 + 16 = 28 de pătrățele = 560 m. 560 − 400 = 160. Răspuns: 160 m."}}]}]]}, {"id": "13", "num": 13, "semester": 1, "title": {"ru": "Функция: понятие, способы задания, график", "ro": "Funcția: noțiune, moduri de definire, grafic"}, "cheat": {"ru": ["Функция f: X → Y — правило, которое каждому x из X ставит в соответствие ровно один y из Y.", "D(f) — область определения (все аргументы x); E(f) — множество значений (все полученные f(x)).", "Диаграмма задаёт функцию, если из каждого элемента X выходит ровно одна стрелка. В элемент Y может приходить сколько угодно стрелок.", "f(a): подставляем a вместо x, отрицательное число — в скобках: f(x) = x<sup>2<\/sup> − 1, f(−3) = 8. «f(x) = 8» — значит, ищем x.", "Способы задания: таблица, диаграмма, график (синтетический способ), формула (аналитический), словесно.", "Целая часть [x] — ближайшее целое число, не превышающее x: [2,7] = 2, [−3,14] = −4.", "График функции — все точки (x; f(x)). Точка A(m; n) лежит на графике, если f(m) = n.", "Вертикальная прямая пересекает график функции не больше чем в одной точке; окружность — не график функции."], "ro": ["Funcția f: X → Y este regula care pune în corespondență fiecărui x din X exact un y din Y.", "D(f) — domeniul de definiție (toate argumentele x); E(f) — mulțimea valorilor (toate valorile f(x) obținute).", "Diagrama definește o funcție dacă din fiecare element al lui X pleacă exact o săgeată. Într-un element al lui Y pot sosi oricâte săgeți.", "f(a): înlocuim x cu a, numărul negativ — în paranteze: f(x) = x<sup>2<\/sup> − 1, f(−3) = 8. „f(x) = 8” — înseamnă că aflăm x.", "Moduri de definire: tabel, diagramă, grafic (modul sintetic), formulă (modul analitic), prin cuvinte.", "Partea întreagă [x] — cel mai apropiat număr întreg care nu depășește x: [2,7] = 2, [−3,14] = −4.", "Graficul funcției — toate punctele (x; f(x)). Punctul A(m; n) aparține graficului dacă f(m) = n.", "O dreaptă verticală intersectează graficul unei funcții în cel mult un punct; cercul nu este graficul unei funcții."]}, "example": {"ru": "Пример: f(x) = 2x + 1. Точка A(a; 7) лежит на графике, если f(a) = 7: 2a + 1 = 7, 2a = 6, a = 3.", "ro": "Exemplu: f(x) = 2x + 1. Punctul A(a; 7) aparține graficului dacă f(a) = 7: 2a + 1 = 7, 2a = 6, a = 3."}, "levels": [[{"q": {"ru": "Функция задана формулой f(x) = 3x − 5. Найдите f(−4).", "ro": "Funcția este definită prin formula f(x) = 3x − 5. Aflați f(−4)."}, "type": "num", "answer": "-17", "explain": {"ru": "f(−4) = 3 · (−4) − 5 = −12 − 5 = −17. Ответ: −17.", "ro": "f(−4) = 3 · (−4) − 5 = −12 − 5 = −17. Răspuns: −17."}, "hint": {"ru": "Подставьте число вместо x в скобках и выполните действия по порядку.", "ro": "Înlocuiți x cu numărul pus în paranteze și efectuați operațiile în ordine."}, "variants": [{"q": {"ru": "Функция задана формулой f(x) = 5x + 2. Найдите f(−3).", "ro": "Funcția este definită prin formula f(x) = 5x + 2. Aflați f(−3)."}, "type": "num", "answer": "-13", "explain": {"ru": "f(−3) = 5 · (−3) + 2 = −15 + 2 = −13. Ответ: −13.", "ro": "f(−3) = 5 · (−3) + 2 = −15 + 2 = −13. Răspuns: −13."}, "hint": {"ru": "Подставьте число вместо x в скобках и выполните действия по порядку.", "ro": "Înlocuiți x cu numărul pus în paranteze și efectuați operațiile în ordine."}}, {"q": {"ru": "Функция задана формулой f(x) = 7 − 2x. Найдите f(−6).", "ro": "Funcția este definită prin formula f(x) = 7 − 2x. Aflați f(−6)."}, "type": "num", "answer": "19", "explain": {"ru": "f(−6) = 7 − 2 · (−6) = 7 + 12 = 19. Ответ: 19.", "ro": "f(−6) = 7 − 2 · (−6) = 7 + 12 = 19. Răspuns: 19."}, "hint": {"ru": "Подставьте число вместо x в скобках и выполните действия по порядку.", "ro": "Înlocuiți x cu numărul pus în paranteze și efectuați operațiile în ordine."}}]}, {"q": {"ru": "f(x) = x<sup>2<\/sup> − 2x. Найдите f(−3).", "ro": "f(x) = x<sup>2<\/sup> − 2x. Aflați f(−3)."}, "type": "num", "answer": "15", "explain": {"ru": "f(−3) = (−3)<sup>2<\/sup> − 2 · (−3) = 9 + 6 = 15. Ответ: 15.", "ro": "f(−3) = (−3)<sup>2<\/sup> − 2 · (−3) = 9 + 6 = 15. Răspuns: 15."}, "hint": {"ru": "Отрицательное число возводите в квадрат в скобках: (−3)<sup>2<\/sup> = 9.", "ro": "Ridicați numărul negativ la pătrat în paranteze: (−3)<sup>2<\/sup> = 9."}, "variants": [{"q": {"ru": "f(x) = x<sup>2<\/sup> + 3x. Найдите f(−5).", "ro": "f(x) = x<sup>2<\/sup> + 3x. Aflați f(−5)."}, "type": "num", "answer": "10", "explain": {"ru": "f(−5) = (−5)<sup>2<\/sup> + 3 · (−5) = 25 − 15 = 10. Ответ: 10.", "ro": "f(−5) = (−5)<sup>2<\/sup> + 3 · (−5) = 25 − 15 = 10. Răspuns: 10."}, "hint": {"ru": "Отрицательное число возводите в квадрат в скобках: (−3)<sup>2<\/sup> = 9.", "ro": "Ridicați numărul negativ la pătrat în paranteze: (−3)<sup>2<\/sup> = 9."}}, {"q": {"ru": "f(x) = 2x<sup>2<\/sup> − 1. Найдите f(−2).", "ro": "f(x) = 2x<sup>2<\/sup> − 1. Aflați f(−2)."}, "type": "num", "answer": "7", "explain": {"ru": "f(−2) = 2 · (−2)<sup>2<\/sup> − 1 = 2 · 4 − 1 = 7. Ответ: 7.", "ro": "f(−2) = 2 · (−2)<sup>2<\/sup> − 1 = 2 · 4 − 1 = 7. Răspuns: 7."}, "hint": {"ru": "Отрицательное число возводите в квадрат в скобках: (−3)<sup>2<\/sup> = 9.", "ro": "Ridicați numărul negativ la pătrat în paranteze: (−3)<sup>2<\/sup> = 9."}}]}, {"q": {"ru": "Каждому ученику класса ставится в соответствие его дата рождения. Является ли это соответствие функцией?", "ro": "Fiecărui elev din clasă i se pune în corespondență data lui de naștere. Este această corespondență o funcție?"}, "type": "choice", "options": {"ru": ["Да, это функция", "Нет, это не функция"], "ro": ["Da, este funcție", "Nu, nu este funcție"]}, "answer": 0, "explain": {"ru": "У каждого ученика ровно одна дата рождения. То, что у двоих учеников она может совпасть, разрешено. Ответ: Да, это функция.", "ro": "Fiecare elev are exact o dată de naștere. Faptul că doi elevi pot avea aceeași dată este permis. Răspuns: Da, este funcție."}, "hint": {"ru": "Проверьте: каждому ли элементу первого множества что-то соответствует и ровно ли одно?", "ro": "Verificați: fiecărui element din prima mulțime îi corespunde ceva și anume exact un singur element?"}, "variants": [{"q": {"ru": "Каждому человеку из группы ставится в соответствие его номер телефона. У Ромы и Лены по два телефона. Является ли это соответствие функцией?", "ro": "Fiecărei persoane din grup i se inut x − 3 = 2. Sunt aceste ecuații echivalente?"}, "type": "choice", "options": {"ru": ["Нет: потерян корень 0", "Да, уравнения равносильны", "Нет: у второго уравнения нет корней"], "ro": ["Nu: s-a pierdut soluția 0", "Da, ecuațiile sunt echivalente", "Nu: a doua ecuație nu are soluții"]}, "answer": 1, "explain": {"ru": "Делили на число 5 ≠ 0 — получили равносильное уравнение; у обоих корень 5. Ответ: Да, уравнения равносильны.", "ro": "Am împărțit la numărul 5 ≠ 0 — am obținut o ecuație echivalentă; ambele au soluția 5. Răspuns: Da, ecuațiile sunt echivalente."}, "hint": {"ru": "Делить обе части можно только на число, не равное нулю. Найдите корни обоих уравнений и сравните.", "ro": "Putem împărți ambii membri doar la un număr diferit de zero. Aflați soluțiile ambelor ecuații și comparați-le."}}, {"q": {"ru": "Ник разделил обе части уравнения x(x + 2) = 5x на x и получил x + 2 = 5. Равносильны ли эти уравнения?", "ro": "Nick a împărțit ambii membri ai ecuației x(x + 2) = 5x la x și a obținut x + 2 = 5. Sunt aceste ecuații echivalente?"}, "type": "choice", "options": {"ru": ["Нет: у второго уравнения нет корней", "Да, уравнения равносильны", "Нет: потерян корень 0"], "ro": ["Nu: a doua ecuație nu are soluții", "Da, ecuațiile sunt echivalente", "Nu: s-a pierdut soluția 0"]}, "answer": 2, "explain": {"ru": "У первого корни 0 и 3, у второго только 3 — корень 0 потерян. Ответ: Нет: потерян корень 0.", "ro": "Prima are soluțiile 0 și 3, a doua doar 3 — soluția 0 s-a pierdut. Răspuns: Nu: s-a pierdut soluția 0."}, "hint": {"ru": "Делить обе части можно только на число, не равное нулю. Найдите корни обоих уравнений и сравните.", "ro": "Putem împărți ambii membri doar la un număr diferit de zero. Aflați soluțiile ambelor ecuații și comparați-le."}}]}]]}, {"id": "16", "num": 16, "semester": 2, "title": {"ru": "Задачи на составление уравнений", "ro": "Probleme rezolvate cu ajutorul ecuațiilor"}, "cheat": {"ru": ["План: обозначьте неизвестное через x → выразите остальные величины через x → составьте уравнение → решите → проверьте и ответьте на вопрос задачи.", "«на 5 больше» — x + 5; «в 3 раза больше» — 3x; «в 3 раза меньше» — {x/3}; 20 % от x — 0,2x.", "Последовательные натуральные числа: x, x + 1, x + 2; последовательные чётные: x, x + 2, x + 4.", "«Было — стало»: при перекладывании общее количество не меняется: в одном месте −a, в другом +a.", "Движение: s = v · t, t = {s/v}. По течению v + u, против течения v − u.", "Все величины — в одних единицах: 9 кг = 9000 г, 30 мин = 0,5 ч.", "«выгоднее», «не меньше», «не больше» → неравенство. Для целых предметов n &gt; 7,5 ⇒ n ≥ 8."], "ro": ["Planul: notați necunoscuta cu x → exprimați celelalte mărimi prin x → alcătuiți ecuația → rezolvați → verificați și răspundeți la întrebarea problemei.", "„cu 5 mai mult” — x + 5; „de 3 ori mai mult” — 3x; „de 3 ori mai puțin” — {x/3}; 20 % din x — 0,2x.", "Numere naturale consecutive: x, x + 1, x + 2; numere pare consecutive: x, x + 2, x + 4.", "„A fost — a devenit”: la mutare cantitatea totală nu se schimbă: într-un loc −a, în altul +a.", "Mișcarea: s = v · t, t = {s/v}. În sensul curentului v + u, contra curentului v − u.", "Toate mărimile — în aceleași unități: 9 kg = 9000 g, 30 min = 0,5 h.", "„mai avantajos”, „cel puțin”, „cel mult” → inecuație. Pentru obiecte întregi n &gt; 7,5 ⇒ n ≥ 8."]}, "example": {"ru": "Пример: на стоянке 48 мотоциклов и машин, у них 168 колёс. Мотоциклов x, машин 48 − x: 2x + 4(48 − x) = 168, 192 − 2x = 168, x = 12. Ответ: 12 мотоциклов.", "ro": "Exemplu: într-o parcare sunt 48 de motociclete și mașini, ele au 168 de roți. Motociclete x, mașini 48 − x: 2x + 4(48 − x) = 168, 192 − 2x = 168, x = 12. Răspuns: 12 motociclete."}, "levels": [[{"q": {"ru": "У Ани в игре в 4 раза больше кристаллов, чем у Бори, а вместе у них 350 кристаллов. Сколько кристаллов у Ани?", "ro": "Ana are în joc de 4 ori mai multe cristale decât Bora, iar împreună au 350 de cristale. Câte cristale are Ana?"}, "type": "num", "answer": "280", "explain": { шее из них.", "ro": "Suma a trei numere naturale consecutive este 72. Aflați cel mai mic dintre ele."}, "type": "num", "answer": "23", "explain": {"ru": "x + (x + 1) + (x + 2) = 72, 3x = 69, x = 23 (числа 23, 24, 25). Ответ: 23.", "ro": "x + (x + 1) + (x + 2) = 72, 3x = 69, x = 23 (numerele 23, 24, 25). Răspuns: 23."}, "hint": {"ru": "Обозначьте первое число через x, следующие — через x + 1, x + 2 … (чётные — через x + 2, x + 4).", "ro": "Notați primul număr cu x, următoarele — x + 1, x + 2 … (cele pare — x + 2, x + 4)."}, "variants": [{"q": {"ru": "Сумма трёх последовательных чётных чисел равна 90. Найдите наибольшее из них.", "ro": "Suma a trei numere pare consecutive este 90. Aflați cel mai mare dintre ele."}, "type": "num", "answer": "32", "explain": {"ru": "x + (x + 2) + (x + 4) = 90, 3x = 84, x = 28. Числа 28, 30, 32. Ответ: 32.", "ro": "x + (x + 2) + (x + 4) = 90, 3x = 84, x = 28. Numerele 28, 30, 32. Răspuns: 32."}, "hint": {"ru": "Обозначьте первое число через x, следующие — через x + 1, x + 2 … (чётные — через x + 2, x + 4).", "ro": "Notați primul număr cu x, următoarele — x + 1, x + 2 … (cele pare — x + 2, x + 4)."}}, {"q": {"ru": "Сумма четырёх последовательных натуральных чисел равна 106. Найдите наименьшее из них.", "ro": "Suma a patru numere naturale consecutive este 106. Aflați cel mai mic dintre ele."}, "type": "num", "answer": "25", "explain": {"ru": "x + (x + 1) + (x + 2) + (x + 3) = 106, 4x = 100, x = 25. Ответ: 25.", "ro": "x + (x + 1) + (x + 2) + (x + 3) = 106, 4x = 100, x = 25. Răspuns: 25."}, "hint": {"ru": "Обозначьте первое число через x, следующие — через x + 1, x + 2 … (чётные — через x + 2, x + 4).", "ro": "Notați primul număr cu x, următoarele — x + 1, x + 2 … (cele pare — x + 2, x + 4)."}}]}, {"q": {"ru": "Кира задумала число, увеличила его в 5 раз и вычла 7. Получилось 38. Какое число задумала Кира?", "ro": "Kira s-a gândit la un număr, l-a mărit de 5 ori și a scăzut 7. A obținut 38. La ce număr s-a gândit Kira?"}, "type": "num", "ans  23, x = 10. Lungimea 13. Răspuns: 13 cm."}, "hint": {"ru": "Выразите все стороны через x и сложите их — это периметр.", "ro": "Exprimați toate laturile prin x și adunați-le — acesta este perimetrul."}, "variants": [{"q": {"ru": "Длина прямоугольной грядки в 2 раза больше ширины, периметр 54 м. Найдите ширину грядки.", "ro": "Lungimea unui strat dreptunghiular este de 2 ori mai mare decât lățimea, perimetrul este 54 m. Aflați lățimea stratului."}, "type": "num", "answer": "9", "unit": {"ru": "м", "ro": "m"}, "explain": {"ru": "Ширина x, длина 2x: 2(x + 2x) = 54, 6x = 54, x = 9. Ответ: 9 м.", "ro": "Lățimea x, lungimea 2x: 2(x + 2x) = 54, 6x = 54, x = 9. Răspuns: 9 m."}, "hint": {"ru": "Выразите все стороны через x и сложите их — это периметр.", "ro": "Exprimați toate laturile prin x și adunați-le — acesta este perimetrul."}}, {"q": {"ru": "Вторая сторона треугольника на 2 см длиннее первой, третья — на 3 см длиннее первой. Периметр 26 см. Найдите первую сторону.", "ro": "A doua latură a unui triunghi este cu 2 cm mai lungă decât prima, a treia — cu 3 cm mai lungă decât prima. Perimetrul este 26 cm. Aflați prima latură."}, "type": "num", "answer": "7", "unit": {"ru": "см", "ro": "cm"}, "explain": {"ru": "x + (x + 2) + (x + 3) = 26, 3x = 21, x = 7. Ответ: 7 см.", "ro": "x + (x + 2) + (x + 3) = 26, 3x = 21, x = 7. Răspuns: 7 cm."}, "hint": {"ru": "Выразите все стороны через x и сложите их — это периметр.", "ro": "Exprimați toate laturile prin x și adunați-le — acesta este perimetrul."}}]}], [{"q": {"ru": "В первом сундуке в Minecraft в 3 раза больше алмазов, чем во втором. Если переложить 24 алмаза из первого во второй, станет поровну. Сколько алмазов было в первом сундуке?", "ro": "În primul cufăr din Minecraft sunt de 3 ori mai multe diamante decât în al doilea. Dacă mutăm 24 de diamante din primul în al doilea, vor fi în mod egal. Câte diamante erau în primul cufăr?"}, "type": "num", "answer": "72", "explain": {"ru": "Во втором x, в первом 3x: 3x − 24 = x + 24, 2x = 48, x = 24. В первом 72. Ответ: 72.", "ro": "În al doilea x, în primul 3x: 3x − 24 = x + 24, 2x = 48, x = 24. În primul 72. Răspuns: 72."}, "hint": {"ru": "Составьте таблицу «было — стало»: из одного места −a, в другое +a. Потом приравняйте то, что стало.", "ro": "Alcătuiți tabelul „a fost — a devenit”: dintr-un loc −a, în celălalt +a. Apoi egalați ceea ce a devenit."}, "variants": [{"q": {"ru": "В двух чатах 90 человек. Если 5 человек перейдут из первого чата во второй, в чатах станет поровну. Сколько человек было в первом чате?", "ro": "În două grupuri de chat sunt 90 de persoane. Dacă 5 persoane trec din primul grup în al doilea, vor fi în mod egal. Câte persoane erau în primul grup?"}, "type": "num", "answer": "50", "explain": {"ru": "В первом x, во втором 90 − x: x − 5 = 95 − x, 2x = 100, x = 50. Ответ: 50.", "ro": "În primul x, în al doilea 90 − x: x − 5 = 95 − x, 2x = 100, x = 50. Răspuns: 50."}, "hint": {"ru": "Составьте таблицу «было — стало»: из одного места −a, в другое +a. Потом приравняйте то, что стало.", "ro": "Alcătuiți tabelul „a fost — a devenit”: dintr-un loc −a, în celălalt +a. Apoi egalați ceea ce a devenit."}}, {"q": {"ru": "На первой полке в 2 раза больше комиксов, чем на второй. Когда с первой полки переложили 15 комиксов на вторую, на второй стало на 5 комиксов больше, чем на первой. Сколько комиксов было на второй полке?", "ro": "Pe primul raft sunt de 2 ori mai multe benzi desenate decât pe al doilea. După ce s-au mutat 15 benzi desenate de pe primul raft pe al doilea, pe al doilea au devenit cu 5 mai multe decât pe primul. Câte benzi desenate erau pe al doilea raft?"}, "type": "num", "answer": "25", "explain": {"ru": "На второй x, на первой 2x. Стало: x + 15 и 2x − 15. x + 15 = (2x − 15) + 5, x = 25. Ответ: 25.", "ro": "Pe al doilea x, pe primul 2x. A devenit: x + 15 și 2x − 15. x + 15 = (2x − 15) + 5, x = 25. Răspuns: 25."}, "hint": {"ru": "Составьте таблицу «было — стало»: из одного места −a, в другое +a. Потом приравняйте то, что стало.", "ro": "Alcătuiți tabelul „a fost — a devenit”: dintr-un loc −a, în celălalt +a. Apoi egalați ceea ce a devenit."}}]}, {"q": {"ru": "Ден ехал к озеру на велосипеде со скоростью 12 км/ч, а обратно — 8 км/ч. На весь путь ушло 2,5 часа. Найдите расстояние до озера.", "ro": "Den a mers la lac cu bicicleta cu viteza de 12 km/h, iar înapoi — cu 8 km/h. Tot drumul a durat 2,5 ore. Aflați distanța până la lac."}, "type": "num", "answer": "12", "unit": {"ru": "км", "ro": "km"}, "explain": {"ru": "{x/12} + {x/8} = 2,5. Умножаем на 24: 2x + 3x = 60, x = 12. Ответ: 12 км.", "ro": "{x/12} + {x/8} = 2,5. Înmulțim cu 24: 2x + 3x = 60, x = 12. Răspuns: 12 km."}, "hint": {"ru": "Обозначьте расстояние через x. Время = {расстояние/скорость}. Сложите (или вычтите) времена.", "ro": "Notați distanța cu x. Timpul = {distanța/viteza}. Adunați (sau scădeți) timpii."}, "variants": [{"q": {"ru": "Лиза доехала до парка на самокате со скоростью 15 км/ч, а обратно шла пешком со скоростью 5 км/ч. На весь путь ушло 2 часа. Найдите расстояние до парка.", "ro": "Liza a mers până în parc cu trotineta cu viteza de 15 km/h, iar înapoi a mers pe jos cu viteza de 5 km/h. Tot drumul a durat 2 ore. Aflați distanța până la parc."}, "type": "num", "answer": "7.5", "unit": {"ru": "км", "ro": "km"}, "explain": {"ru": "{x/15} + {x/5} = 2. Умножаем на 15: x + 3x = 30, x = 7,5. Ответ: 7,5 км.", "ro": "{x/15} + {x/5} = 2. Înmulțim cu 15: x + 3x = 30, x = 7,5. Răspuns: 7,5 km."}, "hint": {"ru": "Обозначьте расстояние через x. Время = {расстояние/скорость}. Сложите (или вычтите) времена.", "ro": "Notați distanța cu x. Timpul = {distanța/viteza}. Adunați (sau scădeți) timpii."}}, {"q": {"ru": "Автобус едет со скоростью 60 км/ч и тратит на дорогу на 1 час больше, чем машина со скоростью 90 км/ч. Найдите длину дороги.", "ro": "Un autobuz merge cu viteza de 60 km/h și face pe drum cu 1 oră mai mult decât o mașină cu viteza de 90 km/h. Aflați lungimea drumului."}, "type": "num", "answer": "180", "unit": {"ru": "км", &gt; 3x − 5 ⇔ −2 &gt; −5 — adevărat pentru orice x. Răspuns: S = ℝ (orice număr)."}, "hint": {"ru": "Раскройте скобки и перенесите слагаемые с x в одну часть. Если x исчез — проверьте, верно ли оставшееся числовое неравенство.", "ro": "Desfaceți parantezele și treceți termenii cu x într-un membru. Dacă x a dispărut — verificați dacă inegalitatea numerică rămasă este adevărată."}}]}, {"q": {"ru": "Подписка А на фильмы: 80 леев в месяц и 2 лея за фильм. Подписка Б: 5 леев за фильм без оплаты за месяц. При каком наименьшем числе фильмов в месяц подписка А выгоднее?", "ro": "Abonamentul de filme A: 80 de lei pe lună și 2 lei pentru un film. Abonamentul B: 5 lei pentru un film, fără plată lunară. Pentru ce număr minim de filme pe lună abonamentul A este mai avantajos?"}, "type": "num", "answer": "27", "unit": {"ru": "фильмов", "ro": "filme"}, "explain": {"ru": "80 + 2n &lt; 5n, 80 &lt; 3n, n &gt; 26{2/3}. Наименьшее целое 27. Ответ: 27 фильмов.", "ro": "80 + 2n &lt; 5n, 80 &lt; 3n, n &gt; 26{2/3}. Cel mai mic număr întreg 27. Răspuns: 27 filme."}, "hint": {"ru": "Запишите стоимость (периметр) через неизвестное, составьте неравенство и выберите подходящее целое значение.", "ro": "Scrieți costul (perimetrul) prin necunoscută, alcătuiți inecuația și alegeți valoarea întreagă potrivită."}, "variants": [{"q": {"ru": "Прокат самокатов: «А» — 10 леев за старт и 2 лея за минуту, «Б» — 3,5 лея за минуту без платы за старт. При каком наибольшем целом числе минут «Б» дешевле?", "ro": "Închirierea trotinetelor: „A” — 10 lei la pornire și 2 lei pe minut, „B” — 3,5 lei pe minut fără plată la pornire. Pentru ce număr întreg maxim de minute „B” este mai ieftin?"}, "type": "num", "answer": "6", "unit": {"ru": "мин", "ro": "min"}, "explain": {"ru": "3,5m &lt; 10 + 2m, 1,5m &lt; 10, m &lt; 6{2/3}. Наибольшее целое 6. Ответ: 6 мин.", "ro": "3,5m &lt; 10 + 2m, 1,5m &lt; 10, m &lt; 6{2/3}. Cel mai mare număr întreg 6. Răspuns: 6 min."}, "hint": {"ru": "Запишите стоимость (периметр) через неиз ați necunoscuta cu coeficientul 1 sau −1 și substituiți-o (în paranteze!) în cealaltă ecuație.", "Metoda reducerii: înmulțiți ecuația (ambii membri, fiecare termen) ca coeficienții să devină opuși și adunați; dacă sunt egali — scădeți.", "Aflați a doua necunoscută, faceți verificarea în ambele ecuații și scrieți răspunsul ca pereche (x; y).", "Dreptele se intersectează — o soluție; sunt paralele (s-a obținut 0 = 2) — nu are soluții; coincid (0 = 0) — o infinitate.", "ax = b: a ≠ 0 — o soluție x = {b/a}; a = 0, b ≠ 0 — nu are soluții; a = 0, b = 0 — orice număr.", "Parametrul după soluție: substituiți soluția cunoscută în locul lui x și rezolvați ecuația în raport cu a."]}, "example": {"ru": "Пример: {2x + 3y = 13; 4x − y = 5}. Второе уравнение умножим на 3: 12x − 3y = 15. Сложим: 14x = 28, x = 2; 4 + 3y = 13, y = 3. Ответ: (2; 3).", "ro": "Exemplu: {2x + 3y = 13; 4x − y = 5}. A doua ecuație o înmulțim cu 3: 12x − 3y = 15. Adunăm: 14x = 28, x = 2; 4 + 3y = 13, y = 3. Răspuns: (2; 3)."}, "levels": [[{"q": {"ru": "Решите систему {x + y = 10; x − y = 4}. Введите x и y через «;».", "ro": "Rezolvați sistemul {x + y = 10; x − y = 4}. Introduceți x și y separate prin „;”."}, "type": "set", "answer": ["7", "3"], "ordered": true, "explain": {"ru": "2x = 14, x = 7; 7 + y = 10, y = 3. Ответ: (7; 3).", "ro": "2x = 14, x = 7; 7 + y = 10, y = 3. Răspuns: (7; 3)."}, "hint": {"ru": "Сложите уравнения: y исчезнет. Найдите x, затем y.", "ro": "Adunați ecuațiile: y dispare. Aflați x, apoi y."}, "variants": [{"q": {"ru": "Решите систему {x + y = 3; x − y = 9}. Введите x и y через «;».", "ro": "Rezolvați sistemul {x + y = 3; x − y = 9}. Introduceți x și y separate prin „;”."}, "type": "set", "answer": ["6", "-3"], "ordered": true, "explain": {"ru": "2x = 12, x = 6; 6 + y = 3, y = −3. Ответ: (6; −3).", "ro": "2x = 12, x = 6; 6 + y = 3, y = −3. Răspuns: (6; −3)."}, "hint": {"ru": "Сложите уравнения: y исчезнет. Найдите x, затем y.", "ro": "Adunați ecuațiile: y dispare. Aflați x, apoi y."}} are a lui a sistemul {x + y = 5; x − y = a} are o soluție cu x = 4?"}, "type": "num", "answer": "3", "hint": {"ru": "Подставьте x = 4 в первое уравнение и найдите y, затем подставьте пару во второе.", "ro": "Substituiți x = 4 în prima ecuație și aflați y, apoi substituiți perechea în a doua."}, "explain": {"ru": "Из первого: 4 + y = 5, y = 1. Во второе: a = 4 − 1 = 3. Ответ: 3.", "ro": "Din prima: 4 + y = 5, y = 1. În a doua: a = 4 − 1 = 3. Răspuns: 3."}}]}, {"q": {"ru": "При каком a уравнение (a − 4)x = 7 не имеет решений?", "ro": "Pentru ce valoare a lui a ecuația (a − 4)x = 7 nu are soluții?"}, "type": "num", "answer": "4", "explain": {"ru": "При a = 4: 0 · x = 7 — неверно при любом x. Ответ: 4.", "ro": "Pentru a = 4: 0 · x = 7 — fals pentru orice x. Răspuns: 4."}, "hint": {"ru": "Уравнение ax = b «особенное», когда коэффициент при x равен 0. Найдите такое a и проверьте правую часть.", "ro": "Ecuația ax = b este „specială” când coeficientul lui x este 0. Aflați un astfel de a și verificați membrul drept."}, "variants": [{"q": {"ru": "При каком a уравнение (a + 3)x = a + 3 имеет бесконечно много решений?", "ro": "Pentru ce valoare a lui a ecuația (a + 3)x = a + 3 are o infinitate de soluții?"}, "type": "num", "answer": "-3", "explain": {"ru": "При a = −3: 0 · x = 0 — верно при любом x. При других a корень x = 1. Ответ: −3.", "ro": "Pentru a = −3: 0 · x = 0 — adevărat pentru orice x. Pentru alți a soluția este x = 1. Răspuns: −3."}, "hint": {"ru": "Уравнение ax = b «особенное», когда коэффициент при x равен 0. Найдите такое a и проверьте правую часть.", "ro": "Ecuația ax = b este „specială” când coeficientul lui x este 0. Aflați un astfel de a și verificați membrul drept."}}, {"q": {"ru": "При каком a уравнение (2a − 5)x = 3 не имеет решений?", "ro": "Pentru ce valoare a lui a ecuația (2a − 5)x = 3 nu are soluții?"}, "type": "num", "answer": "2.5", "explain": {"ru": "2a − 5 = 0, a = 2,5: 0 · x = 3 — неверно при любом x. Ответ: 2,5.", "ro": "2a − 5 = 0, a = 2,5: 0 · x = 3 — fals pentru orice x. Răspuns: 2,5."}, "hint": {"ru": "Уравнение ax = b «особенное», когда коэффициент при x равен 0. Найдите такое a и проверьте правую часть.", "ro": "Ecuația ax = b este „specială” când coeficientul lui x este 0. Aflați un astfel de a și verificați membrul drept."}}]}, {"q": {"ru": "В классе 28 учеников. На робототехнику ходят половина мальчиков и треть девочек — всего 11 человек. Сколько в классе девочек?", "ro": "În clasă sunt 28 de elevi. La robotică merg jumătate din băieți și o treime din fete — în total 11 persoane. Câte fete sunt în clasă?"}, "type": "num", "answer": "18", "explain": {"ru": "{x + y = 28; {x/2} + {y/3} = 11}. Второе × 6: 3x + 2y = 66; x = 28 − y: 84 − 3y + 2y = 66, y = 18. Ответ: 18.", "ro": "{x + y = 28; {x/2} + {y/3} = 11}. A doua × 6: 3x + 2y = 66; x = 28 − y: 84 − 3y + 2y = 66, y = 18. Răspuns: 18."}, "hint": {"ru": "Обозначьте две неизвестные величины через x и y и запишите каждое условие отдельным уравнением.", "ro": "Notați cele două mărimi necunoscute cu x și y și scrieți fiecare condiție ca ecuație separată."}, "variants": [{"q": {"ru": "Команда сыграла 40 матчей без поражений: за победу 3 очка, за ничью 1. Всего 96 очков. Сколько было ничьих?", "ro": "O echipă a jucat 40 de meciuri fără înfrângeri: pentru victorie 3 puncte, pentru egal 1. În total 96 de puncte. Câte meciuri au fost egale?"}, "type": "num", "answer": "12", "explain": {"ru": "{x + y = 40; 3x + y = 96}. Вычтем: 2x = 56, x = 28 побед, y = 12. Ответ: 12.", "ro": "{x + y = 40; 3x + y = 96}. Scădem: 2x = 56, x = 28 de victorii, y = 12. Răspuns: 12."}, "hint": {"ru": "Обозначьте две неизвестные величины через x и y и запишите каждое условие отдельным уравнением.", "ro": "Notați cele două mărimi necunoscute cu x și y și scrieți fiecare condiție ca ecuație separată."}}, {"q": {"ru": "Если старшая сестра отдаст младшей 5 стикеров, у них станет поровну. Если же младшая отдаст старшей 5 стикеров, у старшей станет вдвое больше. Сколько стикеров у старшей?", "ro": "Dacă sora mai mare îi dă celei mai mici 5 abțibilduri, vor avea în mod egal. Dacă însă cea mică îi dă celei mari 5 abțibilduri, cea mare va avea de două ori mai multe. Câte abțibilduri are sora mai mare?"}, "type": "num", "answer": "35", "explain": {"ru": "{x − 5 = y + 5; x + 5 = 2(y − 5)}. x = y + 10: y + 15 = 2y − 10, y = 25, x = 35. Ответ: 35.", "ro": "{x − 5 = y + 5; x + 5 = 2(y − 5)}. x = y + 10: y + 15 = 2y − 10, y = 25, x = 35. Răspuns: 35."}, "hint": {"ru": "Обозначьте две неизвестные величины через x и y и запишите каждое условие отдельным уравнением.", "ro": "Notați cele două mărimi necunoscute cu x și y și scrieți fiecare condiție ca ecuație separată."}}]}, {"q": {"ru": "Лодка за 3 ч по течению проходит 60 км, а за 4 ч против течения — 56 км. Найдите собственную скорость лодки.", "ro": "O barcă parcurge în 3 h în sensul curentului 60 km, iar în 4 h contra curentului — 56 km. Aflați viteza proprie a bărcii."}, "type": "num", "answer": "17", "unit": {"ru": "км/ч", "ro": "km/h"}, "explain": {"ru": "v + u = 60 : 3 = 20, v − u = 56 : 4 = 14. Сложим: 2v = 34, v = 17. Ответ: 17 км/ч.", "ro": "v + u = 60 : 3 = 20, v − u = 56 : 4 = 14. Adunăm: 2v = 34, v = 17. Răspuns: 17 km/h."}, "hint": {"ru": "Найдите скорость по течению и против течения ({путь/время}). Это v + u и v − u — решите систему.", "ro": "Aflați viteza în sensul curentului și contra curentului ({distanța/timpul}). Acestea sunt v + u și v − u — rezolvați sistemul."}, "variants": [{"q": {"ru": "Катер за 2 ч по течению проходит 36 км, а за 3 ч против течения — 42 км. Найдите скорость течения.", "ro": "O șalupă parcurge în 2 h în sensul curentului 36 km, iar în 3 h contra curentului — 42 km. Aflați viteza curentului."}, "type": "num", "answer": "2", "unit": {"ru": "км/ч", "ro": "km/h"}, "explain": {"ru": "v + u = 18, v − u = 14. Вычтем: 2u = 4, u = 2. Ответ: 2 км/ч.", "ro": "v + u = 18, v − u = 14. Scădem: 2u = 4, u = 2. Răspuns: 2 km/h."}, "hint": {"ru": "Найдите скорость по течению и против те ă puncte distincte trece o singură dreaptă.", "Dacă C se află pe [AB], atunci AC + CB = AB. Mijlocul M al segmentului: AM = MB = AB : 2.", "Prin n puncte, oricare trei necoliniare, trec {n(n − 1)/2} drepte.", "d(A, B) ≤ d(A, C) + d(C, B); egalitate — numai dacă C se află pe [AB]. Distanța până la o dreaptă — pe perpendiculară.", "Două drepte coincid, se intersectează (un punct comun) sau sunt paralele. Distanța dintre paralele este peste tot aceeași.", "Unghiuri: ascuțit (sub 90°), drept (90°), obtuz (între 90° și 180°), alungit (180°). Bisectoarea împarte unghiul în jumătate.", "Unghiurile adiacente ale căror laturi formează o dreaptă au suma 180° (adiacente suplementare). Unghiurile opuse la vârf sunt congruente.", "1° = 60′, 1′ = 60″. La scădere „împrumutăm”: 180° = 179°60′."]}, "example": {"ru": "Пример: две прямые пересеклись, один угол 40°. Смежный с ним 180° − 40° = 140°, вертикальные к ним — тоже 40° и 140°. Углы: 40°, 140°, 40°, 140°.", "ro": "Exemplu: două drepte s-au intersectat, un unghi are 40°. Unghiul adiacent: 180° − 40° = 140°, opuse la vârf cu ele — tot 40° și 140°. Unghiurile: 40°, 140°, 40°, 140°."}, "levels": [[{"q": {"ru": "Прямая дорожка ведёт от дома A до стадиона B, AB = 1200 м. Магазин C стоит на этой дорожке, AC = 450 м. Найдите CB.", "ro": "O alee dreaptă duce de la casa A până la stadionul B, AB = 1200 m. Magazinul C se află pe această alee, AC = 450 m. Aflați CB."}, "type": "num", "answer": "750", "unit": {"ru": "м", "ro": "m"}, "hint": {"ru": "Точка C лежит на отрезке [AB], значит AC + CB = AB.", "ro": "Punctul C se află pe segmentul [AB], deci AC + CB = AB."}, "explain": {"ru": "AC + CB = AB, поэтому CB = 1200 − 450 = 750 м.", "ro": "AC + CB = AB, deci CB = 1200 − 450 = 750 m."}, "variants": [{"q": {"ru": "Прямая дорожка ведёт от школы A до парка B, AB = 950 м. Киоск C стоит на этой дорожке, AC = 380 м. Найдите CB.", "ro": "O alee dreaptă duce de la școala A până la parcul B, AB = 950 m. Chioșcul C se află pe această alee, AC = 380 m.
