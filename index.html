": {"ru": "Высказывания, теоремы, конгруэнтность фигур", "ro": "Propoziții, teoreme, congruența figurilor"}, "cheat": {"ru": ["Высказывание — утверждение, которое точно истинно (И) или ложно (Л). Мнение, вопрос, просьба — не высказывания.", "Отрицание («не…», «неверно, что…») всегда имеет противоположное значение.", "«A и B» истинно, если верны обе части; «A или B» — если верна хотя бы одна.", "Аксиому принимают без доказательства, теорему доказывают. «Если U, то Z»: U — условие, Z — заключение.", "Обратное утверждение «Если Z, то U» бывает и истинным, и ложным. Один контрпример опровергает утверждение.", "Фигуры конгруэнтны (F₁ ≡ F₂), если совпадают при наложении: у отрезков равны длины, у углов — величины, у окружностей — радиусы.", "△ABC ≡ △MNK: A ↔ M, B ↔ N, C ↔ K, значит AB = MN, BC = NK, ∠B = ∠N. У конгруэнтных фигур равны периметры и площади.", "Равная площадь ещё не значит конгруэнтность: 2 × 8 и 4 × 4."], "ro": ["Propoziția este un enunț sigur adevărat (A) sau fals (F). Părerea, întrebarea, rugămintea nu sunt propoziții.", "Negația („nu…”, „nu este adevărat că…”) are întotdeauna valoarea opusă.", "„A și B” este adevărată dacă ambele părți sunt adevărate; „A sau B” — dacă cel puțin una este adevărată.", "Axioma se acceptă fără demonstrație, teorema se demonstrează. „Dacă I, atunci C”: I — ipoteza, C — concluzia.", "Reciproca „Dacă C, atunci I” poate fi adevărată sau falsă. Un singur contraexemplu infirmă afirmația.", "Figurile sunt congruente (F₁ ≡ F₂) dacă coincid prin suprapunere: segmentele au lungimi egale, unghiurile — măsuri egale, cercurile — raze egale.", "△ABC ≡ △MNK: A ↔ M, B ↔ N, C ↔ K, deci AB = MN, BC = NK, ∠B = ∠N. Figurile congruente au perimetre și arii egale.", "Arii egale nu înseamnă congruență: 2 × 8 și 4 × 4."]}, "example": {"ru": "Пример: «Если число делится на 6, то оно делится на 3» — истинно. Условие: делится на 6; заключение: делится на 3. Обратное «Если число делится на 3, то оно делится на 6» ложно: контрпример 9.", "ro": "Exemplu: „Dacă un număr se împarte exact la 6, atunci el se împarte exact la 3” — adevărată. Ipoteza: se împarte la 6; concluzia: se împarte la 3. Reciproca „Dacă un număr se împarte exact la 3, atunci el se împarte exact la 6” este falsă: contraexemplu 9."}, "levels": [[{"q": {"ru": "Какое из предложений является высказыванием?", "ro": "Care dintre enunțuri este o propoziție (matematică)?"}, "type": "choice", "answer": 1, "options": {"ru": ["«Математика — самый интересный предмет»", "«Число 24 делится на 5»", "«Решите пример 3 + 4»", "«Какой сегодня день?»"], "ro": ["„Matematica este cea mai interesantă materie”", "„Numărul 24 se împarte exact la 5”", "„Rezolvați exemplul 3 + 4”", "„Ce zi este azi?”"]}, "hint": {"ru": "Высказывание — это то, про что можно точно сказать «верно» или «неверно». Мнения, вопросы и просьбы — не высказывания.", "ro": "Propoziția este un enunț despre care putem spune sigur „adevărat” sau „fals”. Părerile, întrebările și rugămințile nu sunt propoziții."}, "explain": {"ru": "«Число 24 делится на 5» — высказывание (ложное). Остальные — мнение, вопрос или просьба.", "ro": "„Numărul 24 se împarte exact la 5” este o propoziție (falsă). Celelalte sunt o părere, o întrebare sau o rugăminte."}, "variants": [{"q": {"ru": "Выберите предложение, которое является математическим высказыванием.", "ro": "Alegeți enunțul care este o propoziție matematică."}, "type": "choice", "answer": 3, "options": {"ru": ["«Майнкрафт — лучшая игра»", "«Сколько вам лет?»", "«Посмотрите на доску»", "«У квадрата 4 стороны»"], "ro": ["„Minecraft este cel mai bun joc”", "„Câți ani ai?”", "„Priviți la tablă”", "„Pătratul are 4 laturi”"]}, "hint": {"ru": "Высказывание — это то, про что можно точно сказать «верно» или «неверно». Мнения, вопросы и просьбы — не высказывания.", "ro": "Propoziția este un enunț despre care putem spune sigur „adevărat” sau „fals”. Părerile, întrebările și rugămințile nu sunt propoziții."}, "explain": {"ru": "«У квадрата 4 стороны» — высказывание (истинное). Остальные — мнение, вопрос или просьба.", "ro": "„Pătratul are 4 laturi” este o propoziție (adevărată). Celelalte sunt o părere, o întrebare sau o rugăminte."}}, {"q": {"ru": "Про какое из предложений можно точно сказать «истинно» или «ложно»?", "ro": "Despre care dintre enunțuri putem spune sigur „adevărat” sau „fals”?"}, "type": "choice", "answer": 0, "options": {"ru": ["«Число 7 простое»", "«Пицца очень вкусная»", "«Открой окно»", "«Кто выиграл матч?»"], "ro": ["„Numărul 7 este prim”", "„Pizza este foarte gustoasă”", "„Deschideți fereastra”", "„Cine a câștigat meciul?”"]}, "hint": {"ru": "Высказывание — это то, про что можно точно сказать «верно» или «неверно». Мнения, вопросы и просьбы — не высказывания.", "ro": "Propoziția este un enunț despre care putem spune sigur „adevărat” sau „fals”. Părerile, întrebările și rugămințile nu sunt propoziții."}, "explain": {"ru": "«Число 7 простое» — высказывание (истинное). Остальные — мнение, вопрос или просьба.", "ro": "„Numărul 7 este prim” este o propoziție (adevărată). Celelalte sunt o părere, o întrebare sau o rugăminte."}}]}, {"q": {"ru": "△ABC ≡ △MNK, AB = 5 см, BC = 7 см, AC = 6 см. Найдите NK.", "ro": "△ABC ≡ △MNK, AB = 5 cm, BC = 7 cm, AC = 6 cm. Aflați NK."}, "type": "num", "answer": "7", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "Порядок букв в записи показывает, какие вершины соответствуют друг другу.", "ro": "Ordinea literelor arată care vârfuri își corespund."}, "explain": {"ru": "N соответствует B, K — C, поэтому NK = BC = 7 см.", "ro": "N corespunde lui B, K — lui C, deci NK = BC = 7 cm."}, "variants": [{"q": {"ru": "△DEF ≡ △PQR, DE = 9 см, EF = 4 см, DF = 11 см. Найдите PR.", "ro": "△DEF ≡ △PQR, DE = 9 cm, EF = 4 cm, DF = 11 cm. Aflați PR."}, "type": "num", "answer": "11", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "Порядок букв в записи показывает, какие вершины соответствуют друг другу.", "ro": "Ordinea literelor arată care vârfuri își corespund."}, "explain": {"ru": "P соответствует D, R — F, поэтому PR = DF = 11 см.", "ro": "P corespunde lui D, R — lui F, deci PR = DF = 11 cm."}}, {"q": {"ru": "△KLM ≡ △STU, KL = 12 см, LM = 8 см, KM = 10 см. Найдите ST.", "ro": "△KLM ≡ △STU, KL = 12 cm, LM = 8 cm, KM = 10 cm. Aflați ST."}, "type": "num", "answer": "12", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "Порядок букв в записи показывает, какие вершины соответствуют друг другу.", "ro": "Ordinea literelor arată care vârfuri își corespund."}, "explain": {"ru": "S соответствует K, T — L, поэтому ST = KL = 12 см.", "ro": "S corespunde lui K, T — lui L, deci ST = KL = 12 cm."}}]}, {"q": {"ru": "Две пиццы имеют форму кругов, ограниченных конгруэнтными окружностями. Диаметр первой 32 см. Найдите радиус второй.", "ro": "Două pizze au forma unor discuri mărginite de cercuri congruente. Diametrul primei este de 32 cm. Aflați raza celei de-a doua."}, "type": "num", "answer": "16", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "Окружности конгруэнтны, если равны их радиусы. Диаметр в 2 раза больше радиуса.", "ro": "Cercurile sunt congruente dacă razele lor sunt egale. Diametrul este de 2 ori mai mare decât raza."}, "explain": {"ru": "Радиусы равны: 32 : 2 = 16 см.", "ro": "Razele sunt egale: 32 : 2 = 16 cm."}, "variants": [{"q": {"ru": "Колёса велосипеда — конгруэнтные окружности. Радиус переднего колеса 34 см. Найдите диаметр заднего.", "ro": "Roțile bicicletei sunt cercuri congruente. Raza roții din față este de 34 cm. Aflați diametrul roții din spate."}, "type": "num", "answer": "68", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "Окружности конгруэнтны, если равны их радиусы. Диаметр в 2 раза больше радиуса.", "ro": "Cercurile sunt congruente dacă razele lor sunt egale. Diametrul este de 2 ori mai mare decât raza."}, "explain": {"ru": "Радиус заднего тоже 34 см, диаметр 2 · 34 = 68 см.", "ro": "Raza roții din spate este tot 34 cm, diametrul 2 · 34 = 68 cm."}}, {"q": {"ru": "Две монеты — конгруэнтные круги (их окружности конгруэнтны). Диаметр первой 2,8 см. Найдите радиус второй.", "ro": "Două monede sunt discuri cu cercuri congruente. Diametrul primei este de 2,8 cm. Aflați raza celei de-a doua."}, "type": "num", "answer": "1.4", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "Окружности конгруэнтны, если равны их радиусы. Диаметр в 2 раза больше радиуса.", "ro": "Cercurile sunt congruente dacă razele lor sunt egale. Diametrul este de 2 ori mai mare decât raza."}, "explain": {"ru": "Радиусы равны: 2,8 : 2 = 1,4 см.", "ro": "Razele sunt egale: 2,8 : 2 = 1,4 cm."}}]}, {"q": {"ru": "Две наклейки — конгруэнтные прямоугольники. Стороны первой 8 см и 5 см. Найдите площадь второй наклейки.", "ro": "Două abțibilduri sunt dreptunghiuri congruente. Laturile primului sunt de 8 cm și 5 cm. Aflați aria celui de-al doilea abțibild."}, "type": "num", "answer": "40", "unit": {"ru": "см²", "ro": "cm²"}, "hint": {"ru": "У конгруэнтных фигур равны соответственные стороны, а значит, периметры и площади.", "ro": "Figurile congruente au laturile corespunzătoare egale, deci perimetrele și ariile egale."}, "explain": {"ru": "Наклейки совпадают при наложении, поэтому площадь второй такая же: 8 · 5 = 40 см².", "ro": "Abțibildurile coincid prin suprapunere, deci aria celui de-al doilea este aceeași: 8 · 5 = 40 cm²."}, "variants": [{"q": {"ru": "Две наклейки — конгруэнтные прямоугольники. Стороны первой 12 см и 7 см. Найдите периметр второй наклейки.", "ro": "Două abțibilduri sunt dreptunghiuri congruente. Laturile primului sunt de 12 cm și 7 cm. Aflați perimetrul celui de-al doilea abțibild."}, "type": "num", "answer": "38", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "У конгруэнтных фигур равны соответственные стороны, а значит, периметры и площади.", "ro": "Figurile congruente au laturile corespunzătoare egale, deci perimetrele și ariile egale."}, "explain": {"ru": "Наклейки совпадают при наложении, поэтому периметр второй такой же: 2 · (12 + 7) = 38 см.", "ro": "Abțibildurile coincid prin suprapunere, deci perimetrul celui de-al doil еугольники ABC и CDA, причём △ABC ≡ △CDA. AB = 9 см, BC = 6,5 см. Найдите периметр ABCD.", "ro": "Diagonala AC împarte patrulaterul ABCD în triunghiurile ABC și CDA, iar △ABC ≡ △CDA. AB = 9 cm, BC = 6,5 cm. Aflați perimetrul lui ABCD."}, "type": "num", "answer": "31", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "Выпишите соответствие вершин: A ↔ C, B ↔ D, C ↔ A.", "ro": "Scrieți corespondența vârfurilor: A ↔ C, B ↔ D, C ↔ A."}, "explain": {"ru": "AB = CD = 9 см, BC = DA = 6,5 см. P = 2 · (9 + 6,5) = 31 см.", "ro": "AB = CD = 9 cm, BC = DA = 6,5 cm. P = 2 · (9 + 6,5) = 31 cm."}}, {"q": {"ru": "Диагональ AC делит четырёхугольник ABCD на треугольники ABC и CDA, причём △ABC ≡ △CDA. AB = 12 см, BC = 15 см. Найдите периметр ABCD.", "ro": "Diagonala AC împarte patrulaterul ABCD în triunghiurile ABC și CDA, iar △ABC ≡ △CDA. AB = 12 cm, BC = 15 cm. Aflați perimetrul lui ABCD."}, "type": "num", "answer": "54", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "Выпишите соответствие вершин: A ↔ C, B ↔ D, C ↔ A.", "ro": "Scrieți corespondența vârfurilor: A ↔ C, B ↔ D, C ↔ A."}, "explain": {"ru": "AB = CD = 12 см, BC = DA = 15 см. P = 2 · (12 + 15) = 54 см.", "ro": "AB = CD = 12 cm, BC = DA = 15 cm. P = 2 · (12 + 15) = 54 cm."}}]}, {"q": {"ru": "Сколько из этих высказываний истинны? а) 2<sup>5<\/sup> = 32; б) «наименьшее натуральное число — 0»; в) «все простые числа нечётные»; г) «91 — простое число»; д) «отрицание высказывания „17 — простое число“ истинно».", "ro": "Câte dintre aceste propoziții sunt adevărate? a) 2<sup>5<\/sup> = 32; b) „cel mai mic număr natural este 0”; c) „toate numerele prime sunt impare”; d) „91 este număr prim”; e) „negația propoziției «17 este număr prim» este adevărată”."}, "type": "num", "answer": "2", "hint": {"ru": "Проверьте каждое отдельно; для чисел попробуйте разложить на множители.", "ro": "Verificați fiecare separat; pentru numere încercați descompunerea în factori."}, "explain": {"ru": "а) И, б) И, в) Л (2 — простое и чётное), г) Л (91 = 7 · 13), д) Л (17 простое, значит отрицание ложно). Истинных: 2.", "ro": "a) A, b) A, c) F (2 este prim și par), d) F (91 = 7 · 13), e) F (17 este prim, deci negația e falsă). Adevărate: 2."}, "variants": [{"q": {"ru": "Сколько из этих высказываний истинны? а) 3<sup>4<\/sup> = 12; б) «если два отрезка конгруэнтны, то их длины равны»; в) «число 1 — простое»; г) «окружность радиуса 5 см и окружность диаметра 10 см конгруэнтны»; д) «111 делится на 3».", "ro": "Câte dintre aceste propoziții sunt adevărate? a) 3<sup>4<\/sup> = 12; b) „dacă două segmente sunt congruente, atunci lungimile lor sunt egale”; c) „numărul 1 este prim”; d) „cercul cu raza de 5 cm și cercul cu diametrul de 10 cm sunt congruente”; e) „111 se împarte exact la 3”."}, "type": "num", "answer": "3", "hint": {"ru": "Проверьте каждое отдельно; для чисел попробуйте разложить на множители.", "ro": "Verificați fiecare separat; pentru numere încercați descompunerea în factori."}, "explain": {"ru": "а) Л (3<sup>4<\/sup> = 81), б) И, в) Л (у 1 один делитель), г) И (оба радиуса 5 см), д) И (1 + 1 + 1 = 3). Истинных: 3.", "ro": "a) F (3<sup>4<\/sup> = 81), b) A, c) F (1 are un singur divizor), d) A (ambele raze sunt de 5 cm), e) A (1 + 1 + 1 = 3). Adevărate: 3."}}, {"q": {"ru": "Сколько из этих высказываний истинны? а) 10<sup>3<\/sup> = 1000; б) «каждое чётное число делится на 4»; в) «отрицание ложного высказывания истинно»; г) «51 = 3 · 17»; д) «фигуры с одинаковой площадью всегда конгруэнтны».", "ro": "Câte dintre aceste propoziții sunt adevărate? a) 10<sup>3<\/sup> = 1000; b) „orice număr par se împarte exact la 4”; c) „negația unei propoziții false este adevărată”; d) „51 = 3 · 17”; e) „figurile cu arii egale sunt întotdeauna congruente”."}, "type": "num", "answer": "3", "hint": {"ru": "Проверьте каждое отдельно; для чисел попробуйте разложить на множители.", "ro": "Verificați fiecare separat; pentru numere încercați descompunerea în factori."}, "explain": {"ru": "а) И, б) Л (6 не делится на 4), в) И, г) И, д) Л (2 × 8 и 4 × 4). Истинных: 3.", "ro": "a) A, b) F (6 nu se împarte exact la 4), c) A, d) A, e) F (2 × 8 și 4 × 4). Adevărate: 3."}}]}]]}, {"id": "21", "num": 21, "semester": 2, "title": {"ru": "Треугольники и признаки их конгруэнтности", "ro": "Triunghiuri și criteriile de congruență"}, "cheat": {"ru": ["Треугольник — три неколлинеарные точки и три отрезка. P = AB + BC + AC. Сумма углов 180°.", "По углам: остроугольный, прямоугольный, тупоугольный. По сторонам: разносторонний, равнобедренный, равносторонний.", "Неравенство треугольника: наибольшая сторона меньше суммы двух других. Против большего угла лежит большая сторона.", "Медиана — к середине противолежащей стороны; биссектриса делит угол пополам; высота перпендикулярна прямой стороны.", "Признаки: СУС — две стороны и угол между ними; УСУ — сторона и два прилежащих угла; ССС — три стороны.", "Прямоугольные треугольники: КК, ГК, КУ (катет и прилежащий острый угол), ГУ (гипотенуза и острый угол).", "Равнобедренный: углы при основании равны и острые; медиана, биссектриса и высота к основанию совпадают.", "Угол при основании α = (180° − β) : 2, угол при вершине β = 180° − 2α. В равностороннем все углы 60°."], "ro": ["Triunghiul — trei puncte necoliniare și trei segmente. P = AB + BC + AC. Suma unghiurilor este 180°.", "După unghiuri: ascuțitunghic, dreptunghic, obtuzunghic. După laturi: scalen, isoscel, echilateral.", "Inegalitatea triunghiului: latura cea mai mare este mai mică decât suma celorlalte două. Opus unghiului mai mare se află latura mai mare.", "Mediana — spre mijlocul laturii opuse; bisectoarea împarte unghiul în jumătate; înălțimea este perpendiculară pe dreapta laturii.", "Criterii: LUL — două laturi și unghiul cuprins între ele; ULU — o latură și cele două unghiuri alăturate; LLL — trei laturi.", "Triunghiuri dreptunghice: CC, IC, CU (catetă și unghiul ascuțit alăturat), IU (ipotenuză și un unghi ascuțit).", "Isoscel: unghiurile de la bază sunt congruente și ascuțite; mediana, bisectoarea și înălțimea spre bază coincid.", "Unghiul de la bază α = (180° − β) : 2, unghiul din vârf β = 180° − 2α. În triunghiul echilateral toate unghiurile au 60°."]}, "example": {"ru": "Пример: в равнобедренном треугольнике угол при основании 64°. Угол при вершине 180° − 2 · 64° = 52°. Стороны 5, 5 и 8 см: 8 &lt; 5 + 5, треугольник существует, P = 18 см.", "ro": "Exemplu: în triunghiul isoscel unghiul de la bază are 64°. Unghiul din vârf: 180° − 2 · 64° = 52°. Laturile 5, 5 și 8 cm: 8 &lt; 5 + 5, triunghiul există, P = 18 cm."}, "levels": [[{"q": {"ru": "Флажок для игры имеет форму треугольника. Два угла треугольника равны 47° и 68°. Найдите третий угол.", "ro": "Un fanion pentru joc are formă de triunghi. Două unghiuri ale triunghiului au 47° și 68°. Aflați al treilea unghi."}, "type": "num", "answer": "65", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "Сумма углов треугольника равна 180°.", "ro": "Suma unghiurilor triunghiului este 180°."}, "explain": {"ru": "180° − 47° − 68° = 65°.", "ro": "180° − 47° − 68° = 65°."}, "variants": [{"q": {"ru": "Кусок пиццы имеет форму треугольника. Два угла треугольника равны 39° и 104°. Найдите третий угол.", "ro": "O felie de pizza are formă de triunghi. Două unghiuri ale triunghiului au 39° și 104°. Aflați al treilea unghi."}, "type": "num", "answer": "37", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "Сумма углов треугольника равна 180°.", "ro": "Suma unghiurilor triunghiului este 180°."}, "explain": {"ru": "180° − 39° − 104° = 37°.", "ro": "180° − 39° − 104° = 37°."}}, {"q": {"ru": "Знак дорожного движения — треугольник. Два угла треугольника равны 72° и 55°. Найдите третий угол.", "ro": "Un indicator rutier este un triunghi. Două unghiuri ale triunghiului au 72° și 55°. Aflați al treilea unghi."}, "type": "num", "answer": "53", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "Сумма углов треугольника равна 180°.", "ro": "Suma unghiurilor triunghiului este 180°."}, "explain": {"ru": "180° − 72° − 55° = 53°.", "ro": "180° − 72° − 55° r-un punct exterior unei drepte trece o unică paralelă la ea.", "Două drepte paralele cu a treia sunt paralele între ele.", "Secanta formează 8 unghiuri. a ∥ b ⇔ alternele sunt congruente ⇔ corespondentele sunt congruente ⇔ cele de aceeași parte a secantei au suma 180°.", "Dreptele paralele determină pe laturile unghiului segmente proporționale (teorema lui Thales).", "Linia mijlocie unește mijloacele a două laturi ale triunghiului, este paralelă cu a treia latură și egală cu jumătate din ea.", "Triunghiul format din liniile mijlocii are perimetrul de 2 ori mai mic. Mijloacele laturilor unui patrulater formează un paralelogram cu laturile = jumătăți ale diagonalelor.", "Unghiul exterior = 180° − unghiul triunghiului = suma celor două unghiuri neadiacente cu el. Suma unghiurilor exterioare (câte unul) este 360°."]}, "example": {"ru": "Пример: в △ABC ∠A = 48°, ∠B = 77°. Внешний угол при C: 48° + 77° = 125°, а ∠C = 180° − 125° = 55°.", "ro": "Exemplu: în △ABC ∠A = 48°, ∠B = 77°. Unghiul exterior din C: 48° + 77° = 125°, iar ∠C = 180° − 125° = 55°."}, "levels": [[{"q": {"ru": "Рельсы — параллельные прямые, дорога их пересекает. Прямые a ∥ b пересечены секущей c. Один из внутренних односторонних углов равен 63°. Найдите второй.", "ro": "Șinele sunt drepte paralele, iar un drum le intersectează. Dreptele a ∥ b sunt intersectate de secanta c. Unul dintre unghiurile interne de aceeași parte a secantei are 63°. Aflați-l pe al doilea."}, "type": "num", "answer": "117", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "При параллельных прямых односторонние углы в сумме дают 180°.", "ro": "La drepte paralele unghiurile de aceeași parte a secantei au suma 180°."}, "explain": {"ru": "180° − 63° = 117°.", "ro": "180° − 63° = 117°."}, "variants": [{"q": {"ru": "Линии на тетрадном листе параллельны, их пересекает отрезок. Прямые a ∥ b пересечены секущей c. Один из внутренних односторонних углов равен 128°. Найдите второй.", "ro": "Liniile foii de caiet sunt paralele, un segment le int  периметр треугольника равен 48 см. Найдите наибольшую сторону треугольника.", "ro": "Liniile mijlocii ale unui triunghi sunt în raportul 3 : 4 : 5, iar perimetrul triunghiului este 48 cm. Aflați cea mai mare latură a triunghiului."}, "type": "num", "answer": "20", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "Каждая средняя линия — половина стороны, значит стороны относятся так же.", "ro": "Fiecare linie mijlocie este jumătate dintr-o latură, deci laturile sunt în același raport."}, "explain": {"ru": "Стороны 3k, 4k, 5k: 12k = 48, k = 4; наибольшая 5 · 4 = 20 см.", "ro": "Laturile 3k, 4k, 5k: 12k = 48, k = 4; cea mai mare: 5 · 4 = 20 cm."}, "variants": [{"q": {"ru": "Средние линии треугольника относятся как 2 : 3 : 4, а периметр треугольника равен 54 см. Найдите наибольшую сторону треугольника.", "ro": "Liniile mijlocii ale unui triunghi sunt în raportul 2 : 3 : 4, iar perimetrul triunghiului este 54 cm. Aflați cea mai mare latură a triunghiului."}, "type": "num", "answer": "24", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "Каждая средняя линия — половина стороны, значит стороны относятся так же.", "ro": "Fiecare linie mijlocie este jumătate dintr-o latură, deci laturile sunt în același raport."}, "explain": {"ru": "Стороны 2k, 3k, 4k: 9k = 54, k = 6; наибольшая 4 · 6 = 24 см.", "ro": "Laturile 2k, 3k, 4k: 9k = 54, k = 6; cea mai mare: 4 · 6 = 24 cm."}}, {"q": {"ru": "Средние линии треугольника относятся как 5 : 6 : 7, а периметр треугольника равен 72 см. Найдите наибольшую сторону треугольника.", "ro": "Liniile mijlocii ale unui triunghi sunt în raportul 5 : 6 : 7, iar perimetrul triunghiului este 72 cm. Aflați cea mai mare latură a triunghiului."}, "type": "num", "answer": "28", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "Каждая средняя линия — половина стороны, значит стороны относятся так же.", "ro": "Fiecare linie mijlocie este jumătate dintr-o latură, deci laturile sunt în același raport."}, "explain": {"ru": "Стороны 5k, 6k, 7k: 18k = 72, k = 4; наибольшая 7 · 4 = 28 см.", "ro": "Laturile 5k, 6k, 7k: 18k = 72, k = 4; cea mai mare: 7 · 4 = 28 cm."}}]}, {"q": {"ru": "Два внешних угла треугольника (при разных вершинах) равны 110° и 140°. Найдите наименьший угол треугольника.", "ro": "Două unghiuri exterioare ale unui triunghi (din vârfuri diferite) au 110° și 140°. Aflați cel mai mic unghi al triunghiului."}, "type": "num", "answer": "40", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "Угол треугольника = 180° − внешний угол при той же вершине.", "ro": "Unghiul triunghiului = 180° − unghiul exterior din același vârf."}, "explain": {"ru": "Углы: 180° − 110° = 70°, 180° − 140° = 40°, третий 180° − 70° − 40° = 70°. Наименьший 40°.", "ro": "Unghiurile: 180° − 110° = 70°, 180° − 140° = 40°, al treilea 180° − 70° − 40° = 70°. Cel mai mic: 40°."}, "variants": [{"q": {"ru": "Два внешних угла треугольника (при разных вершинах) равны 95° и 150°. Найдите наименьший угол треугольника.", "ro": "Două unghiuri exterioare ale unui triunghi (din vârfuri diferite) au 95° și 150°. Aflați cel mai mic unghi al triunghiului."}, "type": "num", "answer": "30", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "Угол треугольника = 180° − внешний угол при той же вершине.", "ro": "Unghiul triunghiului = 180° − unghiul exterior din același vârf."}, "explain": {"ru": "Углы: 180° − 95° = 85°, 180° − 150° = 30°, третий 180° − 85° − 30° = 65°. Наименьший 30°.", "ro": "Unghiurile: 180° − 95° = 85°, 180° − 150° = 30°, al treilea 180° − 85° − 30° = 65°. Cel mai mic: 30°."}}, {"q": {"ru": "Два внешних угла треугольника (при разных вершинах) равны 130° и 105°. Найдите наименьший угол треугольника.", "ro": "Două unghiuri exterioare ale unui triunghi (din vârfuri diferite) au 130° și 105°. Aflați cel mai mic unghi al triunghiului."}, "type": "num", "answer": "50", "unit": {"ru": "°", "ro": "°"}, "hint": {"ru": "Угол треугольника = 180° − внешний угол при той же вершине.", "ro": "Unghiul triunghiului = 180° − unghiul exterior din același vârf."}, "explain": {"ru": "Углы: 180° − 130° = 50°, 180° − 105° = 75°, третий 180° − 50° − 75° = 55°. Наименьший 50°.", "ro": "Unghiurile: 180° − 130° = 50°, 180° − 105° = 75°, al treilea 180° − 50° − 75° = 55°. Cel mai mic: 50°."}}]}]]}, {"id": "23", "num": 23, "semester": 2, "title": {"ru": "Медиатриса, биссектриса, замечательные линии", "ro": "Mediatoarea, bisectoarea, liniile importante"}, "cheat": {"ru": ["a ⊥ b: при пересечении все четыре угла прямые. Через любую точку проходит единственная прямая, перпендикулярная данной.", "Расстояние от точки до прямой — длина перпендикуляра, он короче любой наклонной. M(a; b): до Ox — |b|, до Oy — |a|.", "Медиатриса отрезка — прямая через его середину, перпендикулярная ему. Точка на медиатрисе ⇔ равноудалена от концов отрезка.", "Точка внутри угла лежит на биссектрисе ⇔ равноудалена от сторон угла.", "Медианы пересекаются в центре тяжести G, он делит каждую медиану 2 : 1 от вершины.", "Биссектрисы → точка I, равноудалена от сторон (центр вписанной окружности). Медиатрисы → точка O, равноудалена от вершин (центр описанной).", "Точка O: внутри остроугольного, в середине гипотенузы прямоугольного, вне тупоугольного треугольника. Высоты пересекаются в ортоцентре H."], "ro": ["a ⊥ b: la intersecție toate cele patru unghiuri sunt drepte. Prin orice punct trece o unică dreaptă perpendiculară pe cea dată.", "Distanța de la un punct la o dreaptă este lungimea perpendicularei, ea este mai scurtă decât orice oblică. M(a; b): până la Ox — |b|, până la Oy — |a|.", "Mediatoarea segmentului este dreapta prin mijlocul lui, perpendiculară pe el. Punct pe mediatoare ⇔ egal depărtat de capetele segmentului.", "Un punct din interiorul unghiului se află pe bisectoare ⇔ este egal depărtat de laturile unghiului.", "Medianele se intersectează în centrul de greutate G, care împarte fiecare mediană 2 : 1 de la vârf.", "Bisectoarele → punctul I, egal depărtat de laturi (centrul cercului înscris). Mediatoarele → punctul O, egal depărtat de vârfuri (centrul ce  2 · 3 = 10,5 см, AM + BN = 18 см.", "ro": "AM = 3 · 2,5 = 7,5 cm, BN = 7 : 2 · 3 = 10,5 cm, AM + BN = 18 cm."}, "variants": [{"q": {"ru": "Медианы AM и BN треугольника ABC пересекаются в точке G, GM = 3 см, BG = 8 см. Найдите AM + BN.", "ro": "Medianele AM și BN ale triunghiului ABC se intersectează în punctul G, GM = 3 cm, BG = 8 cm. Aflați AM + BN."}, "type": "num", "answer": "21", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "G делит каждую медиану 2 : 1 от вершины: GM — треть AM, BG — две трети BN.", "ro": "G împarte fiecare mediană în raportul 2 : 1 de la vârf: GM este o treime din AM, BG — două treimi din BN."}, "explain": {"ru": "AM = 3 · 3 = 9 см, BN = 8 : 2 · 3 = 12 см, AM + BN = 21 см.", "ro": "AM = 3 · 3 = 9 cm, BN = 8 : 2 · 3 = 12 cm, AM + BN = 21 cm."}}, {"q": {"ru": "Медианы AM и BN треугольника ABC пересекаются в точке G, GM = 4 см, BG = 5 см. Найдите AM + BN.", "ro": "Medianele AM și BN ale triunghiului ABC se intersectează în punctul G, GM = 4 cm, BG = 5 cm. Aflați AM + BN."}, "type": "num", "answer": "19.5", "unit": {"ru": "см", "ro": "cm"}, "hint": {"ru": "G делит каждую медиану 2 : 1 от вершины: GM — треть AM, BG — две трети BN.", "ro": "G împarte fiecare mediană în raportul 2 : 1 de la vârf: GM este o treime din AM, BG — două treimi din BN."}, "explain": {"ru": "AM = 3 · 4 = 12 см, BN = 5 : 2 · 3 = 7,5 см, AM + BN = 19,5 см.", "ro": "AM = 3 · 4 = 12 cm, BN = 5 : 2 · 3 = 7,5 cm, AM + BN = 19,5 cm."}}]}, {"q": {"ru": "В △ABC ∠A = 30°, ∠B = 40°. Где лежит точка пересечения медиатрис его сторон?", "ro": "În △ABC ∠A = 30°, ∠B = 40°. Unde se află punctul de intersecție a mediatoarelor laturilor lui?"}, "type": "choice", "answer": 2, "options": {"ru": ["внутри треугольника", "в середине наибольшей стороны", "вне треугольника"], "ro": ["în interiorul triunghiului", "în mijlocul celei mai mari laturi", "în exteriorul triunghiului"]}, "hint": {"ru": "Найдите третий угол и определите вид треугольника по углам.", "ro": "Aflați al treilea unghi și stabiliți tipul triunghiului după unghiuri."}, "explain": {"ru": "∠C = 180° − 30° − 40° = 110°, треугольник тупоугольный, поэтому точка O — вне треугольника.", "ro": "∠C = 180° − 30° − 40° = 110°, triunghiul este obtuzunghic, deci punctul O se află în exteriorul triunghiului."}, "variants": [{"q": {"ru": "В △ABC ∠A = 50°, ∠B = 60°. Где лежит точка пересечения медиатрис его сторон?", "ro": "În △ABC ∠A = 50°, ∠B = 60°. Unde se află punctul de intersecție a mediatoarelor laturilor lui?"}, "type": "choice", "answer": 0, "options": {"ru": ["внутри треугольника", "в середине наибольшей стороны", "вне треугольника"], "ro": ["în interiorul triunghiului", "în mijlocul celei mai mari laturi", "în exteriorul triunghiului"]}, "hint": {"ru": "Найдите третий угол и определите вид треугольника по углам.", "ro": "Aflați al treilea unghi și stabiliți tipul triunghiului după unghiuri."}, "explain": {"ru": "∠C = 180° − 50° − 60° = 70°, треугольник остроугольный, поэтому точка O — внутри треугольника.", "ro": "∠C = 180° − 50° − 60° = 70°, triunghiul este ascuțitunghic, deci punctul O se află în interiorul triunghiului."}}, {"q": {"ru": "В △ABC ∠A = 35°, ∠B = 55°. Где лежит точка пересечения медиатрис его сторон?", "ro": "În △ABC ∠A = 35°, ∠B = 55°. Unde se află punctul de intersecție a mediatoarelor laturilor lui?"}, "type": "choice", "answer": 1, "options": {"ru": ["внутри треугольника", "в середине наибольшей стороны", "вне треугольника"], "ro": ["în interiorul triunghiului", "în mijlocul celei mai mari laturi", "în exteriorul triunghiului"]}, "hint": {"ru": "Найдите третий угол и определите вид треугольника по углам.", "ro": "Aflați al treilea unghi și stabiliți tipul triunghiului după unghiuri."}, "explain": {"ru": "∠C = 180° − 35° − 55° = 90°, треугольник прямоугольный, поэтому точка O — в середине наибольшей стороны.", "ro": "∠C = 180° − 35° − 55° = 90°, triunghiul este dreptunghic, deci punctul O se află în mijlocul celei mai mari laturi."}}]}]]}, {"id": "24", "num": 24, "semester": 2, "title": {"ru": "Прямоугольный треугольник. Симметрия", "ro": "Triunghiul dreptunghic. Simetria"}, "cheat": {"ru": ["Катеты образуют прямой угол, гипотенуза лежит против него и самая длинная. Острые углы в сумме 90°.", "Медиана к гипотенузе равна половине гипотенузы; середина гипотенузы — центр описанной окружности.", "Катет против угла 30° равен половине гипотенузы; и наоборот: если катет — половина гипотенузы, угол против него 30°.", "A и A₁ симметричны относительно точки O, если O — середина AA₁; относительно прямой a, если a — медиатриса AA₁. Симметричные фигуры конгруэнтны.", "Начало координат: (x; y) → (−x; −y); ось Ox: (x; −y); ось Oy: (−x; y).", "Середина отрезка: ({x₁ + x₂/2}; {y₁ + y₂/2}). Точка, симметричная A относительно B: (2x<sub>B<\/sub> − x<sub>A<\/sub>; 2y<sub>B<\/sub> − y<sub>A<\/sub>).", "Осей симметрии: квадрат 4, равносторонний треугольник 3, прямоугольник 2, равнобедренный треугольник 1, угол 1, окружность — бесконечно много."], "ro": ["Catetele formează unghiul drept, ipotenuza este opusă lui și este cea mai lungă. Unghiurile ascuțite au suma 90°.", "Mediana spre ipotenuză este jumătate din ipotenuză; mijlocul ipotenuzei este centrul cercului circumscris.", "Cateta opusă unghiului de 30° este jumătate din ipotenuză; și invers: dacă o catetă este jumătate din ipotenuză, unghiul opus ei are 30°.", "A și A₁ sunt simetrice față de punctul O dacă O este mijlocul lui AA₁; față de dreapta a, dacă a este mediatoarea lui AA₁. Figurile simetrice sunt congruente.", "Originea: (x; y) → (−x; −y); axa Ox: (x; −y); axa Oy: (−x; y).", "Mijlocul segmentului: ({x₁ + x₂/2}; {y₁ + y₂/2}). Simetricul lui A față de B: (2x<sub>B<\/sub> − x<sub>A<\/sub>; 2y<sub>B<\/sub> − y<sub>A<\/sub>).", "Axe de simetrie: pătrat 4, triunghi echilateral 3, dreptunghi 2, triunghi isoscel 1, unghi 1, cerc — o infinitate."]}, "example": {"ru": "Пример: в △ABC ∠B = 90°, ∠A = 30°, BC = 6 см. BC лежит против угла 30°, поэтому AC = 12 см, а медиана BM = 12 : 2 = 6 см.", "ro": "Exemplu   const LEVEL_COLORS = ["var(--l1)", "var(--l2)", "var(--l3)"];

  const T = () => UI[lang];
  const esc = (s) => String(s);
  // Stacked fractions: {a/b} → markup; leave set notation {1, 2} untouched
  const fmt = (s) => esc(s).replace(/\{([^{}\/<>]+)\/([^{}<>]+)\}/g, '<span class="fr"><span>$1</span><span>$2</span></span>')

  const L = (obj) => (obj && (obj[lang] ?? obj.ru)) || "";

  // ---------- answer parsing ----------
  function parseNum(raw) {
    let s = String(raw).trim().replace(/[−–—]/g, "-").replace(/\s+/g, " ").replace(/%$/, "").trim();
    s = s.replace(/(\d),(\d)/g, "$1.$2");
    let m;
    if ((m = s.match(/^(-?)(\d+) (\d+)\/(\d+)$/))) { const v = +m[2] + (+m[3]) / (+m[4]); return m[1] ? -v : v; }
    if ((m = s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/))) { return (+m[1]) / (+m[2]); }
    if ((m = s.match(/^-?\d*\.?\d+$/))) { return +s; }
    return NaN;
  }
  const close = (a, b, tol) => Math.abs(a - b) <= Math.max(tol || 0, 1e-9 * Math.max(1, Math.abs(b)));
  function checkAnswer(q, value) {
    if (q.type === "choice") return value === q.answer;
    if (value == null || String(value).trim() === "") return false;
    if (q.type === "num") {
      const v = parseNum(value);
      if (isNaN(v)) return false;
      // A fraction like 1/3 has no exact decimal: accept a decimal rounded to hundredths or finer (0,33; 0,333)
      const den = (String(q.answer).match(/\/(\d+)$/) || [])[1];
      const periodic = den && ((n) => { while (n % 2 === 0) n /= 2; while (n % 5 === 0) n /= 5; return n !== 1; })(+den);
      const decimals = (String(value).replace(",", ".").split(".")[1] || "").length;
      const tol = periodic && decimals >= 2 ? Math.max(q.tol || 0, 0.006) : q.tol;
      return close(v, parseNum(q.answer), tol);
    }
    if (q.type === "set") {
      const parts = String(value).replace(/[{}]/g, "").split(/[;\n]/).map((x) => x.trim()).filter(Boolean).map(parseNum);
      const want = q.answer.map(parseNum);
      if (parts.length !== want.length || parts.some(isNaN)) return false;
      if (q.ordered) return parts.every((v, i) => close(v, want[i], q.tol));
      const a = [...parts].sort((x, y) => x - y), b = [...want].sort((x, y) => x - y);
      return a.every((v, i) => close(v, b[i], q.tol));
    }
    return false;
  }
  function answerText(q) {
    if (q.type === "choice") return L(q.options)[q.answer];
    // "2 1/2" → 2{1/2}, "-5/12" → −{5/12}: fmt() then draws stacked fractions
    const show = (a) => String(a).replace(/\./g, ",")
      .replace(/^(-?)(\d+) (\d+)\/(\d+)$/, "$1$2{$3/$4}").replace(/^(-?)(\d+)\/(\d+)$/, "$1{$2/$3}")
      .replace(/-/g, "−");
    if (q.type === "set") return q.answer.map(show).join("; ");

  const dec = (x) => String(Math.round(x * 100) / 100).replace(".", ",");  // decimal comma for RU/RO

  const plain = (s) => String(s).replace(/<v>(.*?)<\/v>/g, "$1\u20D7").replace(/<sup>(.*?)<\/sup>/g, "^$1").replace(/<br\s*\/?>/g, " ").replace(/<[^>]+>/g, "")

  function setPdfStatus(msg) { const el = document.getElementById("pdf-status"); if (el) el.textContent = msg; }
  function buildPdf(R) {

    const NAVY = [31, 58, 104], TEXT = [34, 48, 63], GRAY = [106, 119, 136], OK = [30, 138, 76], BAD = [200, 54, 63];
    const X = 16, W = 178;

      doc.setFont("DV", bold ? "bold" : "normal"); doc.setFontSize(size); doc.setTextColor(...color);
      for (const ln of doc.splitTextToSize(plain(txt), W - indent)) {

      }

    };

    const date = new Date().toLocaleDateString(lang === "ru" ? "ru-RU" : "ro-RO");
    put(T().brand + " · " + T().pdfTitle, { size: 9, color: GRAY, after: 4 });
    put(`${R.t.num === 0 ? "" : T().pdfTopic + " " + R.t.num + ". "}${L(R.t.title)}`, { size: 16, bold: true, color: NAVY, after: 1.5 });
    put(`${T().pdfLevel} ${R.l + 1} (${T().levelName[R.l]}) · ${T().variant(R.variant + 1, R.nVar)} · ${T().pdfDate}: ${date}`, { size: 10, color: GRAY });
    put(`${T().pdfStudent}: ${name}`, { size: 11, bold: true });
    doc.setDrawColor(...NAVY); doc.setFillColor(238, 243, 249);
    doc.roundedRect(X, y, W, 14, 2, 2, "FD");
    doc.setFont("DV", "bold"); doc.setFontSize(12); doc.setTextColor(...NAVY);
    doc.text(`${T().pdfScore}: ${dec(R.got)} / ${R.max}  (${R.pct}%)`, X + 5, y + 9);
    doc.text(`${T().pdfGrade}: ${R.grade}`, X + W - 5, y + 9, { align: "right" });
    y += 21;
    R.rows.forEach((r, i) => {
      if (y > 250) { doc.addPage(); y = 18; }
      doc.setDrawColor(214, 222, 232); doc.line(X, y - 4, X + W, y - 4);
      put(`${i + 1}. ${L(r.q.q)}`, { size: 10.5, bold: true, after: 1.5 });
      put(`${T().pdfYour}: ${r.given || "—"}   [${r.ok ? T().pdfOk : T().pdfBad}]`, { size: 10, color: r.ok ? OK : BAD, indent: 4, after: 0.8 });
      put(`${T().pdfRight}: ${answerText(r.q)}`, { size: 10, indent: 4, after: 0.8 });
      put(`${T().pdfPoints}: ${dec(r.pts)} / ${r.base}${r.hint ? " — " + T().pdfHintUsed : ""}`, { size: 9, color: GRAY, indent: 4, after: 0.8 });
      put(`${T().pdfSolution}: ${L(r.q.explain)}`, { size: 9, color: GRAY, indent: 4, after: 5 });

    for (let p = 1; p <= pages; p++) {

    }
    return doc.output("blob");
  }
  async function savePdf() {
    const R = lastResult;
    if (!R) return;
    if (!window.jspdf) { setPdfStatus(T().pdfNoLib); return; }
    setPdfStatus(T().pdfWork);
    let blob;
    try { blob = buildPdf(R); } catch (e) { setPdfStatus(T().pdfFail); return; }
    const who = (store.get("student", "") || "").trim().replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, "_");
    const filename = `${T().pdfFile}_${R.t.num === 0 ? "Ugly" : T().pdfTopic + String(R.t.num).padStart(2, "0")}_L${R.l + 1}_V${R.variant + 1}${who ? "_" + who : ""}.pdf`;
    const dl = await dlPromise;
    if (dl) {
      try { await dl.save({ filename, data: blob }); setPdfStatus(T().pdfSaved); }

  function renderLevel(t, l, checked) {
    const qs = t.levels[l].map(qAt);
    const base = l + 1;
    let got = 0;
    const rows = [];
    const items = qs.map((q, i) => {
      const st = state[i] || {};
      let cls = "", fb = "";
      if (checked) {
        const ok = checkAnswer(q, st.value);
        const pts = ok ? (st.hint ? base / 2 : base) : 0;
        got += pts;
        const given = q.type === "choice" ? (st.value != null ? L(q.options)[st.value] : "")
          : String(st.value || "").trim().replace(/-/g, "−").replace(/(\d)\.(\d)/g, "$1,$2");
        rows.push({ q, ok, pts, base, hint: !!st.hint, given });

      } else {

      }
      const hint = st.hint ? `<div class="hint"><b>${T().hintShown}:</b> ${fmt(L(q.hint))}</div>`

      return `<article class="q ${cls}" style="--c:${LEVEL_COLORS[l]}"><div class="q-top"><span class="q-n">${i + 1}</span>
        <div class="q-text">${fmt(L(q.q))}</div><span class="q-pts">${base} ${T().ptsShort}</span></div>
        ${input}${hint}${fb}</article>`;
    }).join("");

      const msg = T().msg.find(([min]) => g >= min)[1];
      lastResult = { t, l, variant, nVar: nVariants(t, l), rows, got, max, pct, grade: g };
      score = `<section class="score" aria-live="polite" style="--c:${LEVEL_COLORS[l]}"><div class="grade">${g}<small>${T().grade}</small></div>
        <div><h3>${T().scoreTitle(dec(got), max)} · ${pct}%</h3><div>${msg}</div><div class="bar"><i style="width:${pct}%"></i></div>
        <div class="unit">${T().best}: ${best}%</div></div></section>
        <section class="report"><label for="student-name">${T().name}</label>
          <input id="student-name" type="text" autocomplete="name" placeholder="${T().namePh}" value="${String(store.get("student", "")).replace(/"/g, "&quot;")}">
          <button class="btn" type="button" data-pdf="1">${T().pdf}</button><span id="pdf-status" class="unit" aria-live="polite"></span></section>`;
    }
    const actions = checked
      ? `<button class="btn ghost" data-retry="1">${T().retry}</button>${l < 2 ? `<button class="btn" data-tab="${l + 1}">${T().next} →</button>` : ""}`
      : `<button class="btn" data-check="1">${T().check}</button>`;
    const nv = nVariants(t, l);
    const vchip = nv > 1 ? `<span class="chip vchip">${T().variant(variant + 1, nv)}</span> ` : "";
    return `<p class="intro">${vchip}${T().intro(base)}${nv > 1 ? " " + T().newVariant : ""}</p><div class="qs">${items}</div>${score}<div class="actions">${actions}</div>`;
  }

  let checked = false;
  function render() {
    renderChrome();
    const main = document.getElementById("main");
    const t = TOPICS.find((x) => x.id === current);
    if (!t) { main.innerHTML = renderHome(); return; }
    const tabs = [["sheet", T().sheet, "var(--accent)"], [0, T().level[0], LEVEL_COLORS[0]], [1, T().level[1], LEVEL_COLORS[1]], [2, T().level[2], LEVEL_COLORS[2]]]
      .map(([k, name, c]) => {
        const b = k === "sheet" ? null : store.get(`best:${t.id}:${k}`, null);
        return `<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab === k}" style="--c:${c}"><span class="dot"></span>${name}${b != null ? ` <span class="chip ${chipClass(b)}">${b}%</span>` : ""}</button>`;
      }).join("");
    const body = tab === "sheet" ? renderSheet(t) : renderLevel(t, tab, checked);
    main.innerHTML = `<div class="topic-head"><span class="num">${t.num === 0 ? "∠" : T().topicWord + t.num}</span><h1>${fmt(L(t.title))}</h1></div>
      <div class="tabs" role="tablist">${tabs}</div>${body}`;
  }

  function openTopic(id) { current = id || null; tab = "sheet"; state = {}; checked = false; store.set("topic", current); render(); window.scrollTo(0, 0); }
  function openTab(k) {
    tab = k === "sheet" ? "sheet" : +k; state = {}; checked = false; lastResult = null;
    const t = TOPICS.find((x) => x.id === current);
    variant = (t && tab !== "sheet") ? pickVariant(t, tab) : 0;
    render(); window.scrollTo(0, 0);
  }

  document.addEventListener("click", (e) => {
    const el = e.target.closest("button");
    if (!el) return;
    if (el.id === "prof-real" || el.id === "prof-hum") {
      profile = el.id === "prof-real" ? "real" : "hum"; store.set("profile", profile);
      if (current && !VIS().find((x) => x.id === current)) { current = null; store.set("topic", null); }
      render(); return;
    }
    if (el.id === "lang-ru" || el.id === "lang-ro") { lang = el.id.slice(5); store.set("lang", lang); render(); return; }
    if (el.dataset.topic !== undefined) { openTopic(el.dataset.topic); return; }
    if (el.dataset.tab !== undefined) { openTab(el.dataset.tab); return; }
    if (el.dataset.opt !== undefined) { const i = +el.dataset.q; state[i] = { ...(state[i] || {}), value: +el.dataset.opt }; render(); return; }
    if (el.dataset.hint !== undefined) { const i = +el.dataset.hint; state[i] = { ...(state[i] || {}), hint: true }; render(); return; }
    if (el.dataset.check) {
      checked = true;
      const t = TOPICS.find((x) => x.id === current);
      store.set(`attempt:${t.id}:${tab}`, store.get(`attempt:${t.id}:${tab}`, 0) + 1);
      render(); document.querySelector(".score")?.scrollIntoView({ block: "center" }); return;
    }
    if (el.dataset.pdf) { savePdf(); return; }
    if (el.dataset.retry) { openTab(tab); }
  });
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.matches("input[data-q]")) { const i = +el.dataset.q; state[i] = { ...(state[i] || {}), value: el.value }; }
    if (el.id === "student-name") store.set("student", el.value);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches("input[data-q]")) {
      const inputs = [...document.querySelectorAll("input[data-q]")];
      const next = inputs[inputs.indexOf(e.target) + 1];
      if (next) next.focus(); else document.querySelector("[data-check]")?.focus();
    }
  });
  document.getElementById("pick").addEventListener("change", (e) => openTopic(e.target.value));
  if (current && !VIS().find((t) => t.id === current)) current = null;
  render();
})();
</script>

</body>
</html>
